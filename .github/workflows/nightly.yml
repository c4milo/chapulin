name: nightly

# The slow lane. The check workflow gates every push and PR in
# minutes; everything here runs on a schedule (or on demand) because
# it costs hours or exists to catch drift, not regressions in the
# diff at hand. Policy: a red nightly opens an issue via the report
# job below and blocks the next release; it does not block in-flight
# PRs. A check that becomes fast enough graduates to the PR lane, and
# one that outgrows the PR budget (45 minutes wall) demotes to here.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The slow-tier proofs, hours on a cold cache — one job each, so
  # a proof that never converges starves only its own leg. The cache
  # save runs even on failure or timeout, so interrupted runs converge
  # across nights instead of starting over.
  # Whether each harness's bound is large enough to enter the code it
  # names. A passing verdict cannot answer that, and the tree has shipped
  # proofs that passed while proving less than they claimed (7206f4c,
  # 93e9504). Slow, so it runs here rather than in check.
  proof-reach:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Load the toolchain pins
        # tools/toolchain.env is the one place a tool version is written,
        # so a bump moves one line and both this workflow and the Makefile
        # follow it.
        run: |
          . tools/toolchain.env
          {
            echo "CBMC_VERSION=$CBMC_VERSION"
            echo "KISSAT_VERSION=$KISSAT_VERSION"
            echo "GO_VERSION=$GO_VERSION"
          } >> "$GITHUB_ENV"
      - name: Install CBMC
        run: |
          curl -fsSLO "https://github.com/diffblue/cbmc/releases/download/cbmc-$CBMC_VERSION/ubuntu-24.04-cbmc-$CBMC_VERSION-Linux.deb"
          sudo dpkg -i "ubuntu-24.04-cbmc-$CBMC_VERSION-Linux.deb"
      - run: make proof-reach
      - name: Render the reachability table on the run page
        if: always()
        run: cat bin/proof-coverage.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

  prove-slow:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      # Every leg runs to its own verdict: one heavyweight failing tells
      # us nothing about the others, and cancelling their multi-hour
      # solves would throw away the run's whole point.
      fail-fast: false
      matrix:
        proof: [hkdf_expand, hkdf_expand_label, x25519, x25519_mul_alias_a, x25519_mul_alias_b, x25519_mul_inputs_alias, x25519_sqr, handshake_psk, handshake_pin, x509parse, mlkem_ntt, mlkem_invntt_low, mlkem_invntt_high, mlkem_basemul]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Load the toolchain pins
        # tools/toolchain.env is the one place a tool version is written,
        # so a bump moves one line and both this workflow and the Makefile
        # follow it.
        run: |
          . tools/toolchain.env
          {
            echo "CBMC_VERSION=$CBMC_VERSION"
            echo "KISSAT_VERSION=$KISSAT_VERSION"
            echo "GO_VERSION=$GO_VERSION"
          } >> "$GITHUB_ENV"
      - name: Install CBMC
        run: |
          curl -fsSLO "https://github.com/diffblue/cbmc/releases/download/cbmc-$CBMC_VERSION/ubuntu-24.04-cbmc-$CBMC_VERSION-Linux.deb"
          sudo dpkg -i "ubuntu-24.04-cbmc-$CBMC_VERSION-Linux.deb"
      - name: Cache kissat install
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/kissat-inst
          key: kissat-${{ runner.os }}-${{ env.KISSAT_VERSION }}
      - name: Build and install kissat
        # Every leg here sets PROVE_ONLY, and a lone proof keeps kissat
        # whatever it weighs — the budget fallback applies only to whole-
        # tier runs, so on these legs kissat always runs. The trade: a
        # formula whose kissat-path peak clears the ~14 GiB address-space
        # cap dies as a fast, named FAILED instead of grinding under the
        # built-in solver — better than a 300-minute cancellation, and
        # x25519 went from cancelled-at-cap to 847 s this way.
        run: |
          if [ ! -x ~/kissat-inst/kissat ]; then
            curl -fsSL "https://github.com/arminbiere/kissat/archive/refs/tags/$KISSAT_VERSION.tar.gz" | tar xz
            cd "kissat-$KISSAT_VERSION"
            ./configure
            make -j"$(nproc)"
            mkdir -p ~/kissat-inst
            cp build/kissat ~/kissat-inst/
          fi
          echo "$HOME/kissat-inst" >> "$GITHUB_PATH"
      # One cache per harness: the legs run concurrently and a shared
      # key would let whichever finishes last discard the rest.
      - name: Restore proof cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: proof/.cache
          key: proofs-${{ runner.os }}-${{ matrix.proof }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            proofs-${{ runner.os }}-${{ matrix.proof }}-
            proofs-${{ runner.os }}-
      - name: Prove
        run: |
          set -o pipefail
          make prove-slow 2>&1 | tee /tmp/prove.out
        env:
          PROVE_ONLY: ${{ matrix.proof }}
      # Put the verdict on the run page. run.sh already prints the line
      # that matters — property count and wall time, or the named
      # failure — but a leg the timeout cancels never reaches it, so
      # fall back to the log's last lines, which name the phase it died
      # in. Either beats downloading an artifact to find out.
      - name: Summarize verdict
        if: always()
        run: |
          {
            echo "### ${{ matrix.proof }}"
            echo
            echo '```'
            if grep -qE '^${{ matrix.proof }} ' /tmp/prove.out 2>/dev/null; then
              grep -vE '^(make|\./proof/run\.sh)' /tmp/prove.out | tail -20
            else
              echo 'no verdict: the leg hit its timeout. Last phase reached:'
              tail -3 'proof/results/${{ matrix.proof }}.log' 2>/dev/null \
                || echo '(the proof never started)'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save proof cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: proof/.cache
          key: proofs-${{ runner.os }}-${{ matrix.proof }}-${{ github.run_id }}-${{ github.run_attempt }}
      # always(), not failure(): timeout-minutes cancels the job rather
      # than failing it, so failure() skips exactly the run that needs
      # the logs. run.sh writes one log per proof as it starts, so a
      # cancelled run still says which proof was still going.
      - name: Upload proof logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proof-results-${{ matrix.proof }}
          path: proof/results/
          if-no-files-found: ignore

  # The hybrid build's state-machine enumeration. The classic one runs in
  # check; the two together cost 19 of check's 45 measured minutes against
  # a 45-minute job timeout, so this one moved here rather than deciding
  # the push lane by the clock. It is the only place the pq
  # HelloRetryRequest path runs: the client offers one group, so a real
  # server either takes the share or fails, and only the mock can send a
  # cookie retry.
  handshake-sequence-pq:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Load the toolchain pins
        run: |
          . tools/toolchain.env
          echo "ELAN_INIT_SHA256=$ELAN_INIT_SHA256" >> "$GITHUB_ENV"
      - name: Install elan
        run: |
          set -euo pipefail
          curl -sSf -o "$RUNNER_TEMP/elan-init.sh" https://elan.lean-lang.org/elan-init.sh
          echo "$ELAN_INIT_SHA256  $RUNNER_TEMP/elan-init.sh" | sha256sum -c -
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Cache Lean toolchain and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.elan
            spec/.lake
          key: lean-${{ hashFiles('spec/lean-toolchain', 'spec/lakefile.toml', 'spec/lake-manifest.json', 'spec/**/*.lean') }}
      - name: Enumerate every server message sequence, KEX=pq
        run: |
          set -o pipefail
          make handshake-sequence-pq 2>&1 | tee /tmp/handshake_sequence_pq.out
      - name: Put the verdict on the run page
        if: always()
        run: |
          {
            echo '### handshake_sequence (KEX=pq)'
            echo
            echo '```'
            tail -5 /tmp/handshake_sequence_pq.out 2>/dev/null || echo '(the run produced no output)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Breaks each invariant docs/invariants.md lists and requires a test to
  # object. Nightly, not check: each one rebuilds and reruns a target. An
  # unguarded invariant is a real coverage hole, so a red leg here is a
  # finding, not a flake.
  test-invariants:
    runs-on: ubuntu-24.04
    # 42 minutes measured before the two inv24 violations joined the set.
    # Each of those runs a CBMC proof twice, the baseline and the mutant:
    # the proofs take 156 s (x25519_tail) and 513 s (x25519_step) under
    # kissat on the 4-core container proof/run.sh's figures come from, the
    # mutants 233 s and 829 s on a 10-core development machine, and
    # proof/prove-one.sh holds any one run to an hour.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Load the toolchain pins
        # tools/toolchain.env is the one place a tool version is written,
        # so a bump moves one line and both this workflow and the Makefile
        # follow it.
        run: |
          . tools/toolchain.env
          {
            echo "CBMC_VERSION=$CBMC_VERSION"
            echo "KISSAT_VERSION=$KISSAT_VERSION"
            echo "GO_VERSION=$GO_VERSION"
            echo "ELAN_INIT_SHA256=$ELAN_INIT_SHA256"
            # The gcc codegen gate (test/lint-wide-multiply-gcc.sh) is a
            # violation target and needs the Arm GNU gcc the m3 lane pins.
            echo "ARM_GNU_VERSION=$ARM_GNU_VERSION"
            echo "ARM_GNU_LINUX_SHA256=$ARM_GNU_LINUX_SHA256"
            # The five INV-16 violations whose catch target is a codegen
            # lint need the pinned clang and llvm-nm, as the check job has.
            echo "LLVM_MAJOR=$LLVM_MAJOR"
            echo "LLVM_SH_SHA256=$LLVM_SH_SHA256"
            echo "CLANG_RV=clang-$LLVM_MAJOR"
          } >> "$GITHUB_ENV"
      - name: Install elan
        run: |
          set -euo pipefail
          curl -sSf -o "$RUNNER_TEMP/elan-init.sh" https://elan.lean-lang.org/elan-init.sh
          echo "$ELAN_INIT_SHA256  $RUNNER_TEMP/elan-init.sh" | sha256sum -c -
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Cache Lean toolchain and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.elan
            spec/.lake
          key: lean-${{ hashFiles('spec/lean-toolchain', 'spec/lakefile.toml', 'spec/lake-manifest.json', 'spec/**/*.lean') }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Keep in step with GO_VERSION in check.yml, which is the pin of
          # record; lint-go-pin fails when the two drift.
          go-version: ${{ env.GO_VERSION }}
      - name: Cache the Arm GNU toolchain
        id: armtc
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/armtc
          key: armtc-${{ env.ARM_GNU_VERSION }}-linux-x86_64
      - name: Install the Arm GNU toolchain (pinned)
        if: steps.armtc.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          url="https://gitlab.arm.com/api/v4/projects/tooling%2Fgnu-toolchains-for-arm/packages/generic/gnu-toolchain/${ARM_GNU_VERSION}/arm-gnu-toolchain-${ARM_GNU_VERSION}-x86_64-arm-none-eabi.tar.xz"
          curl -sSL -o /tmp/armtc.tar.xz "$url"
          echo "$ARM_GNU_LINUX_SHA256  /tmp/armtc.tar.xz" | sha256sum -c -
          mkdir -p ~/armtc && tar -xJf /tmp/armtc.tar.xz -C ~/armtc --strip-components=1
      - name: Install clang tools (apt.llvm.org, pinned major)
        # test/lint-wide-multiply.sh and test/lint-runtime-symbols.sh are
        # catch targets here; the script runs as root, so it is checked
        # against LLVM_SH_SHA256 first, as the check job does.
        run: |
          set -euo pipefail
          wget -qO "$RUNNER_TEMP/llvm.sh" https://apt.llvm.org/llvm.sh
          echo "$LLVM_SH_SHA256  $RUNNER_TEMP/llvm.sh" | sha256sum -c -
          sudo bash "$RUNNER_TEMP/llvm.sh" "$LLVM_MAJOR"
          sudo apt-get install -y "llvm-$LLVM_MAJOR"
      - name: Put the Arm GNU gcc on PATH
        # test/violations.py runs test/lint-wide-multiply-gcc.sh with no
        # arguments, and the Makefile resolves that gate's gcc through
        # M3_CC's PATH lookup, so the toolchain goes on PATH rather than
        # being passed as a make variable. The inv16-widemul-mid-widened
        # violation is the one only that gate catches
        # (https://github.com/c4milo/chapulin/issues/106).
        run: echo "$HOME/armtc/bin" >> "$GITHUB_PATH"
      - name: Install CBMC
        # The two inv24 violations name proof/prove-one.sh as their catch
        # target, which runs one x25519 ladder harness through
        # proof/run.sh, and the baseline must verify here before the
        # mutant's verdict counts
        # (https://github.com/c4milo/chapulin/issues/121).
        run: |
          curl -fsSLO "https://github.com/diffblue/cbmc/releases/download/cbmc-$CBMC_VERSION/ubuntu-24.04-cbmc-$CBMC_VERSION-Linux.deb"
          sudo dpkg -i "ubuntu-24.04-cbmc-$CBMC_VERSION-Linux.deb"
      - name: Cache kissat install
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/kissat-inst
          key: kissat-${{ runner.os }}-${{ env.KISSAT_VERSION }}
      - name: Build and install kissat
        # x25519_step verifies in 513 s under kissat and has no measured
        # verdict under the built-in solver, so the wrapper's clock needs
        # kissat here as much as the prove jobs do.
        run: |
          if [ ! -x ~/kissat-inst/kissat ]; then
            curl -fsSL "https://github.com/arminbiere/kissat/archive/refs/tags/$KISSAT_VERSION.tar.gz" | tar xz
            cd "kissat-$KISSAT_VERSION"
            ./configure
            make -j"$(nproc)"
            mkdir -p ~/kissat-inst
            cp build/kissat ~/kissat-inst/
          fi
          echo "$HOME/kissat-inst" >> "$GITHUB_PATH"

      - name: Break every invariant and see what objects
        run: |
          set -o pipefail
          make test-invariants 2>&1 | tee /tmp/invariants.out
      - name: Put the tally on the run page
        if: always()
        run: |
          {
            echo '### test-invariants'
            echo
            echo '```'
            cat /tmp/invariants.out 2>/dev/null || echo '(the run produced no output)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Randomized differential, time-boxed. The PR lane runs the built-in
  # seed so a failure there reproduces bit for bit. This lane draws a
  # fresh seed per run and keeps going until its budget runs out, so
  # the oracle explores inputs no earlier run has tried.
  #
  # Only a real mismatch fails the job. Running out of budget is the
  # normal ending, not a failure: the point is to search for as long as
  # the window allows, not to finish a fixed list. Each run takes about
  # 30 seconds, so a 20-minute budget covers roughly 40 seeds and
  # 130,000 comparisons.
  #
  # A failure prints the seed that found it. CH_DIFF_SEED replays that
  # exact run anywhere, which is why the seed is drawn once and echoed
  # rather than taken from the clock.
  diff-random:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Load the toolchain pins
        run: |
          . tools/toolchain.env
          echo "ELAN_INIT_SHA256=$ELAN_INIT_SHA256" >> "$GITHUB_ENV"
      - name: Install elan
        run: |
          set -euo pipefail
          curl -sSf -o "$RUNNER_TEMP/elan-init.sh" https://elan.lean-lang.org/elan-init.sh
          echo "$ELAN_INIT_SHA256  $RUNNER_TEMP/elan-init.sh" | sha256sum -c -
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Cache Lean toolchain and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.elan
            spec/.lake
          key: lean-${{ hashFiles('spec/lean-toolchain', 'spec/lakefile.toml', 'spec/lake-manifest.json', 'spec/**/*.lean') }}
      - name: Search random seeds until the budget runs out
        env:
          BUDGET_SECONDS: "1200"
        run: |
          set -uo pipefail
          # Build the spec, not just the C: bin/diff shells out to
          # spec/.lake/build/bin/diffspec, and the cache above is a
          # speedup, not a guarantee that the binary is there.
          (cd spec && lake build) || exit 1
          make bin/diff || exit 1
          # One run on the built-in seed first. If that fails the tree
          # is broken, not the search, and the seed loop would report
          # a random seed as the culprit.
          ./bin/diff || { echo "the default seed already fails; not a search result"; exit 1; }
          deadline=$(( $(date +%s) + BUDGET_SECONDS ))
          runs=0
          while [ "$(date +%s)" -lt "$deadline" ]; do
            seed="0x$(openssl rand -hex 8)"
            if ! output=$(CH_DIFF_SEED="$seed" CH_DIFF_X509_ROWS=4 ./bin/diff 2>&1); then
              printf '%s\n' "$output" | tail -25
              {
                echo "### The differential found a mismatch"
                echo
                echo "Seed \`$seed\`, after $runs clean runs. Reproduce with:"
                echo
                echo '```'
                echo "CH_DIFF_SEED=$seed CH_DIFF_X509_ROWS=4 make diff"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            runs=$(( runs + 1 ))
            echo "seed $seed OK ($runs)"
          done
          echo "$runs random seeds, no mismatch" >> "$GITHUB_STEP_SUMMARY"

  # What the Lean spec checks, rendered on the run page like the C
  # coverage table. Nightly because the instrumented build is -O0.
  spec-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Load the toolchain pins
        run: |
          . tools/toolchain.env
          echo "ELAN_INIT_SHA256=$ELAN_INIT_SHA256" >> "$GITHUB_ENV"
      - name: Install elan
        run: |
          set -euo pipefail
          curl -sSf -o "$RUNNER_TEMP/elan-init.sh" https://elan.lean-lang.org/elan-init.sh
          echo "$ELAN_INIT_SHA256  $RUNNER_TEMP/elan-init.sh" | sha256sum -c -
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Cache Lean toolchain and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.elan
            spec/.lake
          key: lean-${{ hashFiles('spec/lean-toolchain', 'spec/lakefile.toml', 'spec/lake-manifest.json', 'spec/**/*.lean') }}
      - run: make spec-coverage
      - name: Report what CBMC proves
        run: make proof-coverage && cat bin/proof-coverage.md >> "$GITHUB_STEP_SUMMARY"
      - name: Render the spec coverage table on the run page
        if: always()
        run: cat bin/spec-coverage.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

  # The ECDSA-arm differential: the PR lane's bin/diff compiles the
  # RSA parser, so the P-256 certificate rows meet real C only here.
  diff-ecdsa:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Load the toolchain pins
        run: |
          . tools/toolchain.env
          echo "ELAN_INIT_SHA256=$ELAN_INIT_SHA256" >> "$GITHUB_ENV"
      - name: Install elan
        run: |
          set -euo pipefail
          curl -sSf -o "$RUNNER_TEMP/elan-init.sh" https://elan.lean-lang.org/elan-init.sh
          echo "$ELAN_INIT_SHA256  $RUNNER_TEMP/elan-init.sh" | sha256sum -c -
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Cache Lean toolchain and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.elan
            spec/.lake
          key: lean-${{ hashFiles('spec/lean-toolchain', 'spec/lakefile.toml', 'spec/lake-manifest.json', 'spec/**/*.lean') }}
      - run: make diff-ecdsa

  # The hybrid-arm differential: the PR lane's bin/diff compiles the
  # x25519 key_share parser, so the 1120-byte hybrid share meets real C
  # only here.
  diff-pq:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Load the toolchain pins
        run: |
          . tools/toolchain.env
          echo "ELAN_INIT_SHA256=$ELAN_INIT_SHA256" >> "$GITHUB_ENV"
      - name: Install elan
        run: |
          set -euo pipefail
          curl -sSf -o "$RUNNER_TEMP/elan-init.sh" https://elan.lean-lang.org/elan-init.sh
          echo "$ELAN_INIT_SHA256  $RUNNER_TEMP/elan-init.sh" | sha256sum -c -
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Cache Lean toolchain and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.elan
            spec/.lake
          key: lean-${{ hashFiles('spec/lean-toolchain', 'spec/lakefile.toml', 'spec/lake-manifest.json', 'spec/**/*.lean') }}
      - run: make diff-pq

  # The deeper UB pass: -O0 sees code the optimizer would delete. The
  # PR lane runs the same suites at -O2, the level that ships.
  san-deep:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make san-check SAN=1 O=0

  # UBSan on the deployment ISA: endianness and MIPS code generation
  # meet the undefined-behavior checks. Trap mode, because Ubuntu's
  # MIPS cross toolchain ships no UBSan runtime: a UB hit dies as
  # SIGILL in a named test instead of printing, which is enough for
  # a gate. ASan stays off here — its shadow memory does not map
  # cleanly under qemu-user.
  mips-ubsan:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update -q && sudo apt-get install -y -q gcc-mips-linux-gnu qemu-user
      - run: >
          make cross-check CROSS=mips-linux-gnu- RUNNER=qemu-mips
          CROSS_EXTRA="-fsanitize=undefined -fsanitize-undefined-trap-on-error"

  # Longer fuzz runs than a PR could afford; the corpus persists so
  # every night extends the last one instead of rediscovering it.
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore fuzz corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin/fuzz
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - run: sudo apt-get update -q && sudo apt-get install -y -q clang
      # FUZZ_TIME is per target and make fuzz runs five, so the budget
      # is 5 x 480 = 40 minutes inside the 45-minute cap. Four targets
      # at 600 fit; the fifth pushed the job to 50 and it was cancelled
      # at the cap two nights running, fuzzing nothing at all.
      - run: make fuzz FUZZ_CC=clang FUZZ_TIME=480
      - name: Save fuzz corpus
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin/fuzz
          key: fuzz-corpus-${{ github.run_id }}

  # A red nightly must be triaged, not scrolled past: file one issue
  # per broken night unless an open nightly-failure issue already
  # exists.
  report:
    needs: [prove-slow, diff-random, diff-ecdsa, spec-coverage, san-deep, mips-ubsan, fuzz, test-invariants, handshake-sequence-pq, diff-pq]
    # A job killed by timeout-minutes concludes as cancelled, not
    # failed, so failure() alone skips this job and a timed-out night
    # files nothing. Both prove-slow timeouts so far were reported only
    # because diff-random failed alongside them.
    if: >-
      ${{ always() && (contains(needs.*.result, 'failure') ||
      contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          # Name the jobs that broke. A matrix reports one rolled-up
          # result, so this says prove-slow without saying which of its
          # legs; the run page has that.
          broke=$(printf '%s' "$NEEDS" | jq -r 'to_entries
            | map(select(.value.result != "success"))
            | map("- \(.key): \(.value.result)") | join("\n")')
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "nightly failure in:title" --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "nightly failure: $(date -u +%F)" \
              --body "Run: $run_url

          $broke

          Policy: triage before the next release; nightly reds block releases, not PRs."
          else
            # One issue per outage, not one per night — but never silence.
            # Dedup used to skip the report entirely while any nightly
            # issue was open, so sixteen consecutive reds filed one issue
            # and a new failure mode would have gone unseen for as long as
            # a stale triage ticket sat there. Comment instead: no new
            # issue, and a job list that changes is visible the next
            # morning rather than never.
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" \
              --body "Still red: $run_url

          $broke"
          fi
