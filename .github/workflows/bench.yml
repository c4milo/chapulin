name: bench

# Times ChaCha20-Poly1305 against AES-128-GCM per byte, one TLS record's
# protection split into its stages, and every primitive and the in-process
# handshakes with OpenSSL beside them, on an x86-64 runner. It writes the
# partner of bench/results-aead-arm64.csv, and the primitives and record
# CSVs under gcc and under the pinned clang,
# bench/results-primitives-linux-x86_64[-avx512]-<compiler>.csv and
# bench/results-record-linux-x86_64[-avx512]-<compiler>.csv, which fill the
# four x86-64 column groups, two CPUs under two compilers, of the table in
# docs/performance.md that sets chapulin beside OpenSSL.
# Someone starts it by hand and nothing else does: a timing belongs to
# the machine that ran it, and a shared runner is a loaded machine, so a
# run is a measurement to read, not a check that passes or fails. No job
# commits anything; each prints its CSVs on the run page and keeps them as
# an artifact, and whoever records one copies it into bench/ with the
# runner's load average from its header.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aead-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Time the AEADs under gcc
        # gcc is the runner's own, as in the check job, and the CSV header
        # records its version. The job reads no pin from
        # tools/toolchain.env, so it runs no load-pins step. bench/aead.sh
        # builds its AES-128-GCM row on the instructions in a host object,
        # and it fails rather than writing a file without that row when
        # the compiler fails the host test.
        run: make bench-aead CC=gcc
      - name: Print the CSV on the run page
        run: |
          {
            echo '```'
            cat bench/results-aead-x86_64.csv
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the CSV
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: results-aead-x86_64
          path: bench/results-aead-x86_64.csv
          if-no-files-found: error
  record-x86_64:
    # One job times the record and the primitives under both compilers, so
    # the four CSVs that fill one x86-64 machine's columns of the table
    # beside OpenSSL come from one runner and one CPU: two jobs may draw two
    # CPU models. The table holds two such machines, one CPU without AVX-512
    # and one with AVX-512 IFMA, on which an x86-64 host object runs RSA's
    # public operation on rsa_ifma.c (docs/decisions.md 119). A hosted
    # runner's CPU model is drawn, not chosen, so each job first checks the
    # CPU it drew and stops when it is the wrong kind; re-run that job until
    # it draws the right one. BENCH_MACHINE puts the second machine's name in
    # its CSVs' file names.
    strategy:
      fail-fast: false
      matrix:
        include:
          - machine: ""
            suffix: ""
          - machine: avx512
            suffix: -avx512
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BENCH_MACHINE: ${{ matrix.machine }}
    steps:
      - name: Check the CPU this runner drew
        env:
          MACHINE: ${{ matrix.machine }}
        run: |
          grep -m1 '^model name' /proc/cpuinfo
          flags=$(grep -m1 '^flags' /proc/cpuinfo | tr -s '[:blank:]' '\n')
          echo "AVX-512 flags: $(grep '^avx512' <<<"$flags" | tr '\n' ' ')"
          has() { grep -qx "$1" <<<"$flags"; }
          if [ -z "$MACHINE" ] && has avx512f; then
            echo "this job times a CPU without AVX-512, and this one has it; re-run the job"
            exit 1
          fi
          if [ "$MACHINE" = avx512 ] && ! has avx512ifma; then
            echo "this job times a CPU with AVX-512 IFMA, and this one lacks it; re-run the job"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/load-pins
      - name: Install clang (apt.llvm.org, pinned major)
        # The record bench's second compiler. The action exports its
        # versioned name as CLANG_RV.
        uses: ./.github/actions/install-llvm
        with:
          major: ${{ env.LLVM_MAJOR }}
          sha256: ${{ env.LLVM_SH_SHA256 }}
      - name: Build the pinned OpenSSL and put it on PATH
        # The OpenSSL rows time `openssl speed` on the same machine. The
        # runner's own OpenSSL is 3.0, which has no ML-KEM; the pinned
        # release has, and each CSV's OpenSSL rows name the version they
        # timed.
        uses: ./.github/actions/install-openssl
        with:
          version: ${{ env.OPENSSL_VERSION }}
          sha256: ${{ env.OPENSSL_SHA256 }}
      - name: Time one record under gcc
        # The runner's own gcc, as in the aead job. bench/record.sh asks
        # make whether the compiler passes the host test, and it fails
        # rather than writing a file without the AES-GCM rows when it
        # does not.
        run: make bench-record CC=gcc
      - name: Time every primitive and the handshakes under gcc
        # The same gcc, with OpenSSL's row beside each primitive it has.
        # bench/primitives.sh reads /proc/cpuinfo for the ch_cfg.cpu value
        # a caller on this CPU states, and the CSV's header names it.
        run: make bench-primitives CC=gcc
      - name: Time one record under the pinned clang
        run: make bench-record CC="$CLANG_RV"
      - name: Time every primitive and the handshakes under the pinned clang
        # build.zig compiles the object with clang, so a Zig project such
        # as colibri runs clang's code, and clang compiles the wide fields'
        # carries otherwise than gcc. This run is on the same CPU as gcc's,
        # in the same job, so the two columns compare. It writes the calls
        # file again; its counts do not depend on the compiler.
        run: make bench-primitives CC="$CLANG_RV"
      - name: Print the CSVs on the run page
        # Each CSV's header holds the runner's load average before and
        # after its run.
        env:
          SUFFIX: ${{ matrix.suffix }}
        run: |
          for csv in "results-primitives-linux-x86_64$SUFFIX-gcc" \
            "results-primitives-linux-x86_64$SUFFIX-clang" \
            "results-record-linux-x86_64$SUFFIX-gcc" "results-record-linux-x86_64$SUFFIX-clang"; do
            echo '```'
            cat "bench/$csv.csv"
            echo '```'
          done >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the CSVs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: results-linux-x86_64${{ matrix.suffix }}
          path: |
            bench/results-primitives-linux-x86_64${{ matrix.suffix }}-gcc.csv
            bench/results-primitives-linux-x86_64${{ matrix.suffix }}-clang.csv
            bench/results-primitives-calls.csv
            bench/results-record-linux-x86_64${{ matrix.suffix }}-gcc.csv
            bench/results-record-linux-x86_64${{ matrix.suffix }}-clang.csv
          if-no-files-found: error
