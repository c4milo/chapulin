# Lab only: times an SVE2 ChaCha20 prototype on a Neoverse N2 (branch lab/n2-sve2-chacha).
name: lab-n2-sve2
on:
  push:
    branches: [lab/n2-sve2-chacha]
permissions:
  contents: read
jobs:
  n2:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Check the CPU this runner drew
        run: |
          implementer=$(sed -n '/^CPU implementer/{s/^CPU implementer[[:space:]]*: //p;q;}' /proc/cpuinfo)
          part=$(sed -n '/^CPU part/{s/^CPU part[[:space:]]*: //p;q;}' /proc/cpuinfo)
          echo "implementer $implementer part $part"
          if [ "$implementer" != 0x41 ] || [ "$part" != 0xd49 ]; then exit 1; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/load-pins
      - name: Install clang (apt.llvm.org, pinned major)
        uses: ./.github/actions/install-llvm
        with:
          major: ${{ env.LLVM_MAJOR }}
          sha256: ${{ env.LLVM_KEY_SHA256 }}
      - name: Measure
        run: bash lab/run_sve2.sh | tee -a "$GITHUB_STEP_SUMMARY"
