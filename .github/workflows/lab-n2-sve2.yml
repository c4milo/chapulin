# Lab only: times an SVE2 ChaCha20 prototype on a Neoverse N2 (branch lab/n2-sve2-chacha).
name: lab-n2-sve2
on:
  push:
    branches: [lab/n2-sve2-chacha]
permissions:
  contents: read
jobs:
  n2:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check the CPU this runner drew
        run: |
          implementer=$(sed -n '/^CPU implementer/{s/^CPU implementer[[:space:]]*: //p;q;}' /proc/cpuinfo)
          part=$(sed -n '/^CPU part/{s/^CPU part[[:space:]]*: //p;q;}' /proc/cpuinfo)
          echo "implementer $implementer part $part"
          if [ "$implementer" != 0x41 ] || [ "$part" != 0xd49 ]; then exit 1; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/load-pins
      - name: Install clang (apt.llvm.org, pinned major)
        uses: ./.github/actions/install-llvm
        with:
          major: ${{ env.LLVM_MAJOR }}
          sha256: ${{ env.LLVM_KEY_SHA256 }}
      - name: Install gcc 14 on Ubuntu 24.04
        if: matrix.os == 'ubuntu-24.04-arm'
        run: command -v gcc-14 || { sudo apt-get update -qq && sudo apt-get install -y -qq gcc-14; }
      - name: Build and time chacha20_sve2.c's copy
        run: |
          if [ "${{ matrix.os }}" = ubuntu-24.04-arm ]; then set -- gcc gcc-14 "$CLANG_RV"; else set -- gcc "$CLANG_RV"; fi
          bash lab/run_copy.sh "$@" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install Valgrind (pinned)
        uses: ./.github/actions/install-valgrind
        with:
          version: ${{ env.VALGRIND_VERSION }}
          sha256: ${{ env.VALGRIND_SHA256 }}
      - name: Run the SVE2 copy under Valgrind
        run: |
          set -x
          W=$(mktemp -d)
          for f in src/chacha20.c src/chacha20_vector.c src/chacha20_sve2.c src/ct.c src/ct_wipe.c lab/sve2_copy.c; do
            gcc -O2 -g -std=c11 -D_DEFAULT_SOURCE -DCH_RAND_EXTERN -DCH_CPU_RUNTIME -Isrc -Iinclude/chapulin -Iinclude -I. -c "$f" -o "$W/$(basename "$f" .c).o"
          done
          gcc "$W"/*.o -o "$W/copy"
          valgrind --version
          valgrind --tool=memcheck --error-exitcode=1 -q "$W/copy" 2>&1 | tail -20 || true
          valgrind --tool=callgrind --callgrind-out-file="$W/cg.out" "$W/copy" 2>&1 | tail -20 || true
          LD_SHOW_AUXV=1 valgrind -q /bin/true 2>&1 | grep -i hwcap || true
