# Lab only: times an SVE2 ChaCha20 prototype on a Neoverse N2 (branch lab/n2-sve2-chacha).
name: lab-n2-sve2
on:
  push:
    branches: [lab/n2-sve2-chacha]
permissions:
  contents: read
jobs:
  n2:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, ubuntu-26.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check the CPU this runner drew
        run: |
          implementer=$(sed -n '/^CPU implementer/{s/^CPU implementer[[:space:]]*: //p;q;}' /proc/cpuinfo)
          part=$(sed -n '/^CPU part/{s/^CPU part[[:space:]]*: //p;q;}' /proc/cpuinfo)
          echo "implementer $implementer part $part"
          if [ "$implementer" != 0x41 ] || [ "$part" != 0xd49 ]; then exit 1; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/load-pins
      - name: Install clang (apt.llvm.org, pinned major)
        uses: ./.github/actions/install-llvm
        with:
          major: ${{ env.LLVM_MAJOR }}
          sha256: ${{ env.LLVM_KEY_SHA256 }}
      - name: Install gcc 14 on Ubuntu 24.04
        if: matrix.os == 'ubuntu-24.04-arm'
        run: command -v gcc-14 || { sudo apt-get update -qq && sudo apt-get install -y -qq gcc-14; }
      - name: Build and time chacha20_sve2.c's copy
        if: false
        run: |
          if [ "${{ matrix.os }}" = ubuntu-24.04-arm ]; then set -- gcc gcc-14 "$CLANG_RV"; else set -- gcc "$CLANG_RV"; fi
          bash lab/run_copy.sh "$@" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Read the copy's pass under each compiler
        run: |
          if [ "${{ matrix.os }}" = ubuntu-24.04-arm ]; then set -- gcc-14; else set -- gcc "$CLANG_RV"; fi
          bash lab/run_barrier.sh "$@"
      - name: The residue search on the copy with and without the hold
        run: |
          if [ "${{ matrix.os }}" = ubuntu-24.04-arm ]; then set -- gcc-14; else set -- gcc "$CLANG_RV"; fi
          for tree in 93c7e8ad1008a986eaa1ee4d6694131133a7fc17 HEAD; do
            git show "$tree:src/chacha20_sve2.c" > /tmp/sve2_$$.c
            cp /tmp/sve2_$$.c src/chacha20_sve2.c
            for cc in "$@"; do
              for round in 1 2 3; do
                rm -f bin/chacha20_equiv_test
                make -s CC="$cc" bin/chacha20_equiv_test > /dev/null
                echo "== $tree $cc round $round: $(CH_REQUIRE_SVE2=1 CH_CHACHA20_EQUIV_SEED=$round ./bin/chacha20_equiv_test 2>&1 | grep -E 'residue|mismatch|SVE2 copy holds' | tr '\n' ' ')"
              done
            done
          done
          git checkout -- src/chacha20_sve2.c
