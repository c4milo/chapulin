name: check

on:
  push:
    branches: [main] # branch pushes get checked via their PR run
  pull_request:
  # The slow half is the slow, mutants and prove jobs. They run on merges
  # to main, here and on a manual run. A pull request gets the one-minute
  # check and the platform jobs only, so review stays fast; main and the
  # nightly get everything.
  schedule:
    - cron: "47 2 * * *"
  workflow_dispatch: # every job on demand, on any ref; the nightly workflow has its own

# On main every run finishes, each in a group of its own, so each push
# gets a verdict and a second push need not wait for the first run to
# end. A run cancelled by the next push left a commit with no verdict,
# and waiting for each run made a series of commits cost a run's time
# apiece. On any other ref a new push supersedes older runs. A cancelled
# run still executes its always() cache save, so no proof work is lost.
concurrency:
  group: ci-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.run_id || 'latest' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}


# Every job runs on a read-only token unless it says otherwise; the
# coverage job raises its own. Stated so nothing rides the implicit
# default, which is what the scanner flags.
permissions:
  contents: read
jobs:
  # Fast signal while the proof tiers grind: line coverage over the
  # library sources, five host binaries x two PIN builds, held to the
  # Makefile's COVERAGE_FLOOR. No proofs, no e2e, minutes not hours.
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The badge step pushes the regenerated SVG to the badges branch; the
    # default token is read-only, so this job alone gets write. The
    # check job keeps the read-only default.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The one job with a write token is also the one that installs
          # pip packages. checkout would write the token to .git/config,
          # where `make coverage` and every package it imports could
          # read it. This keeps it out of .git/config: the badge step
          # below is the only push, and it reads the token from its own
          # env.
          persist-credentials: false
      - name: Install gcovr (hash-pinned)
        # gcovr and its dependencies install from a hash-pinned
        # requirements file, as semgrep does in the check job: a package
        # substituted on the index would otherwise run in the one job
        # that holds a write token. pip-compile --generate-hashes wrote
        # the file, and its header records the command.
        run: pip install --require-hashes -r tools/coverage-requirements.txt
      - run: make coverage
      - name: Render the coverage tables on the run page
        if: always()
        run: cat bin/coverage.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - name: Update the coverage badge branch
        # The badge is a generated SVG on its own orphan branch, so the
        # job never pushes to main: branch protection now requires a
        # green check on every main SHA, which a fresh bot commit cannot
        # carry, and a bypass would re-open the push-to-main surface the
        # protection closed. README links the badge from this branch.
        if: github.ref == 'refs/heads/main'
        env:
          # The write token, in this step's env and nowhere else in the
          # job. checkout stored nothing (persist-credentials above), so
          # the push carries the token in its URL. git prints a URL
          # without its credentials, and the runner masks the token.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 tools/coverage-badge.py bin/coverage.json > /tmp/coverage.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The fetch is anonymous: the repository is public, and only
          # the push needs the token.
          if git fetch origin badges 2>/dev/null; then
            git switch badges
          else
            git switch --orphan badges
          fi
          mkdir -p .github/badges
          cp /tmp/coverage.svg .github/badges/coverage.svg
          if ! git diff --quiet -- .github/badges/coverage.svg 2>/dev/null \
              || ! git ls-files --error-unmatch .github/badges/coverage.svg >/dev/null 2>&1; then
            git add .github/badges/coverage.svg
            git commit -m "chore: update the coverage badge"
            git push "https://x-access-token:$GITHUB_TOKEN@github.com/$GITHUB_REPOSITORY" badges
          fi
      - name: Annotate a floor breach
        if: failure()
        run: echo "::error file=Makefile::coverage fell below COVERAGE_FLOOR; add tests or move the floor down in the same diff with the reason in the commit message"
      - name: Upload the HTML report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-html
          path: bin/cov/html/
          if-no-files-found: ignore

  # ASan + UBSan over the deterministic suites at -O2, the level that
  # ships; the nightly runs the same suites at -O0, where UBSan sees
  # code the optimizer would delete. The committed canary in
  # test/san_selftest.c proves on every run that the sanitizer is
  # armed.
  san:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make san-check SAN=1 O=2

  # The deployment ISA: big-endian mips32r2 under qemu-user. Every
  # byte-exact suite (RFC 8448 traces, Wycheproof, unit vectors) must
  # pass on the target's byte order and code generation, not only on
  # the x86-64 the other jobs run. The job also runs the host object's
  # rows without the AES bit under qemu-x86_64, which the same qemu-user
  # package carries.
  mips:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The aarch64 cross gcc builds the arm64 half of the host object's
      # qemu lane below, which qemu-user's qemu-aarch64 runs.
      - run: sudo apt-get update -q && sudo apt-get install -y -q gcc-mips-linux-gnu qemu-user gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      - name: Count wide multiplies, divisions and conditional branches under the mips gcc
        # lint-wide-multiply in the check job measures clang. This lane
        # ships gcc, whose lowering is its own measurement: it once put
        # a widening multiply back where clang did not
        # (https://github.com/c4milo/chapulin/issues/106). The Makefile
        # picks the spec from the driver's -dumpmachine and fails when
        # none matches, so this step cannot measure nothing.
        run: make lint-wide-multiply-gcc WIDEMUL_GCC=mips-linux-gnu-gcc
      - run: make cross-check CROSS=mips-linux-gnu- RUNNER=qemu-mips
      - name: Run a host object on x86-64 and arm64 CPU models without the instructions its ch_cfg.cpu does not name
        # test/aes-runtime-qemu.sh builds host binaries with the runner's
        # gcc and runs them under qemu-x86_64 on CPU models with AES-NI,
        # PCLMULQDQ, AVX2 or the SHA extensions turned off. The rows whose
        # ch_cfg.cpu leaves a bit clear must pass the vectors and whole
        # QUIC and TCP handshakes on a model without that bit's
        # instructions. The rows with the bit must die of SIGILL there,
        # which shows the model traps the instructions, so a qemu that
        # kept them fails this step rather than passing it. On the model
        # with every instruction it holds sha256_hw.c to sha256.c. It
        # then builds for arm64 with the cross gcc and does the same for
        # the SHA-512 bit under qemu-aarch64, on the cortex-a72 model,
        # which has no FEAT_SHA512, and on max
        # (docs/decisions.md 81, 89, 90 and 93).
        run: make aes-runtime-qemu

  arm64:
    # linux arm64 as a supported platform: the whole deterministic
    # suite roster, built with the runner's own gcc and run natively.
    # Lints stay with the amd64 check job — duplicating that toolchain
    # buys no platform coverage.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # suite-check includes the host object's binaries and the Wycheproof
      # host leg, so this job runs them under gcc: the vector ChaCha20's
      # NEON arm in every run, with and without the multiply bit, whose
      # native copies take the NEON Poly1305 (docs/decisions.md 83 and
      # 87), and with and without the AES bit, whose AES runs on the Arm
      # instructions (docs/decisions.md 89). The check and san jobs run the
      # SSE2 arms on x86-64 (test/platforms.mk, suite-check).
      - run: make suite-check
      # A host object, which holds the vector ChaCha20, both multiplies and
      # the vector Poly1305 as the native copy's: this job packages the
      # NEON arms, and the check job the SSE2 ones in check-lib-webpki.
      - run: make lib-check RAND=extern TRUST=webpki
      # Three host objects under gcc, disassembled: the AES and PMULL
      # instructions must sit in aes_hw.c's, ghash_hw.c's and gcm_hw.c's
      # functions alone, and the SHA-256 instructions in sha256_hw.c's.
      # No QEMU arm64 model turns either extension off, so this job
      # cannot run the answer that the instructions are absent on a CPU
      # without them, as the mips job does for x86-64 (test/platforms.mk,
      # aes-runtime-disasm).
      - run: make -j"$(nproc)" aes-runtime-disasm

  x86-64-kernels:
    # The x86-64 kernels every x86-64 host object carries beside its
    # 128-bit paths, the AVX2 ChaCha20 and AES-GCM's VAES and VPCLMULQDQ
    # kernels, which a session runs where its ch_cfg.cpu names them
    # (docs/decisions.md 89 and 90). The test binaries call them directly
    # or run under a value that names them, and skip a CPU without them in
    # the check job; this job requires the runner's CPU to have AVX2,
    # VAES and VPCLMULQDQ, fails where it lacks one, and runs them under
    # the runner's gcc (test/platforms.mk, x86-64-kernels-check). It
    # requires the SHA extensions the same way, and runs sha256_hw.c's
    # x86-64 arm on them (docs/decisions.md 93).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make x86-64-kernels-check

  macos:
    # macOS on Apple silicon as a supported platform: the arm64 job's
    # roster, built with Apple clang and run natively. No other job
    # builds with Apple clang; before this one, only a development Mac's
    # make check did. tools/toolchain.env pins the Xcode whose clang the
    # development Macs run (XCODE_VERSION), and xcode-27 is the one hosted
    # image that carries it. That leaves two gaps: the image is a preview,
    # which GitHub says may queue, and it runs macOS 27 where the
    # development Macs run macOS 26. Lints stay with the amd64 check job,
    # as they do for arm64: they need the pinned checkers that job
    # installs, and a second copy of that toolchain buys no platform
    # coverage.
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/load-pins
      - name: Select the pinned Xcode
        # Fail unless xcodebuild reports the pinned version: the image can
        # change its default Xcode, and GitHub replaces a patch release
        # with the next one under the same path. The step reads
        # xcodebuild's output whole before grep does, because xcodebuild
        # aborts on a broken pipe when grep -q stops reading at the match.
        run: |
          sudo xcode-select -s "/Applications/Xcode_$XCODE_VERSION.app"
          version=$(xcodebuild -version)
          grep -qx "Xcode $XCODE_VERSION" <<< "$version" \
            || { echo "Xcode is not the pinned $XCODE_VERSION: $version"; exit 1; }
          cc --version
      # suite-check includes the host object's binaries and the Wycheproof
      # host leg, so this job runs them under Apple clang, as the arm64
      # job runs them under gcc: the vector ChaCha20's and Poly1305's NEON
      # arms, with and without the multiply bit and the AES bit, whose AES
      # runs on the Arm instructions.
      - run: make suite-check
      # A host object, which holds the vector ChaCha20, both multiplies and
      # the vector Poly1305 (docs/decisions.md 87 and 89).
      - run: make lib-check RAND=extern TRUST=webpki
      # Three host objects under Apple clang, disassembled: the AES and
      # PMULL instructions must sit in aes_hw.c's, ghash_hw.c's and
      # gcm_hw.c's functions alone, and the SHA-256 instructions in
      # sha256_hw.c's. macOS ships no nproc, so sysctl counts the cores.
      - run: make -j"$(sysctl -n hw.ncpu)" aes-runtime-disasm

  m3:
    # Cortex-M3 as a supported platform: the cross-check roster on
    # QEMU's MPS2-AN385 through newlib semihosting (make m3-check).
    # The Arm GNU toolchain is pinned in tools/toolchain.env and
    # cached by that version.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/load-pins
      - run: sudo apt-get update -q && sudo apt-get install -y -q qemu-system-arm
      # No clang-tidy here: make m3-check runs none. The freertos job
      # installs it because freertos-check lints its test programs.
      - name: Install the Arm GNU toolchain (pinned)
        uses: ./.github/actions/install-arm-gnu
        with:
          version: ${{ env.ARM_GNU_VERSION }}
          sha256: ${{ env.ARM_GNU_LINUX_SHA256 }}
      - name: Count wide multiplies, divisions and conditional branches under the Arm gcc
        # lint-wide-multiply in the check job measures clang. This lane
        # ships the gcc a firmware tree ships, and gcc once fused ct.h's
        # 16x16 pieces back into umlal and umull where clang kept them
        # apart (https://github.com/c4milo/chapulin/issues/106); the
        # Makefile holds every file at zero under it. The spec is picked
        # from the driver's -dumpmachine and no match fails, so this step
        # cannot measure nothing.
        run: make lint-wide-multiply-gcc WIDEMUL_GCC="$HOME/armtc/bin/arm-none-eabi-gcc"
      - run: make m3-check M3_CC="$HOME/armtc/bin/arm-none-eabi-gcc"

  freertos:
    # FreeRTOS as a supported platform, first rung: the pinned kernel
    # boots on QEMU's MPS2-AN385 and two static tasks must interleave
    # before PASS. Same Arm toolchain as the m3 job, same cache.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/load-pins
      - run: sudo apt-get update -q && sudo apt-get install -y -q qemu-system-arm
      - name: Install clang-tidy (apt.llvm.org, pinned major)
        # freertos-check lints its test programs against the fetched
        # kernel headers, so the lane needs the same pinned clang-tidy
        # the check job runs.
        uses: ./.github/actions/install-llvm
        with:
          major: ${{ env.LLVM_MAJOR }}
          sha256: ${{ env.LLVM_SH_SHA256 }}
          clang-tidy: "true"
      - name: Install the Arm GNU toolchain (pinned)
        uses: ./.github/actions/install-arm-gnu
        with:
          version: ${{ env.ARM_GNU_VERSION }}
          sha256: ${{ env.ARM_GNU_LINUX_SHA256 }}
      - run: make freertos-check M3_CC="$HOME/armtc/bin/arm-none-eabi-gcc"

  riscv32:
    # riscv32 as a supported platform: the cross-check roster under
    # qemu-riscv32 user mode, the mips job's own shape. apt carries no
    # riscv32 cross compiler with a libc, so the toolchain is Bootlin's,
    # pinned in tools/toolchain.env by the publisher's sha256 and cached
    # by version. Its libc is ilp32d, so the lane runs the toolchain's
    # own ABI; rv32imac codegen is checked separately by lint-wide-multiply
    # under clang in the check job and under this gcc in the step below,
    # which also measures rv32ic, the core with no multiplier.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/load-pins
      - run: sudo apt-get update -q && sudo apt-get install -y -q qemu-user
      - name: Install the Bootlin toolchain (pinned)
        uses: ./.github/actions/install-rv32
        with:
          version: ${{ env.RV32_TC_VERSION }}
          sha256: ${{ env.RV32_TC_SHA256 }}
      - name: Count wide multiplies, divisions and conditional branches under the riscv32 gcc
        # lint-wide-multiply in the check job measures clang for
        # rv32imac; this is the same count under the gcc this lane ships
        # (https://github.com/c4milo/chapulin/issues/86). The Makefile
        # picks the specs from the driver's -dumpmachine and fails when
        # none matches, so this step cannot measure nothing. Two match
        # this driver: rv32imac, and rv32ic, where softmul.c compiles and
        # is held at zero calls to __muldi3 -- gcc at -Os once emitted
        # one from inside __muldi3 itself
        # (https://github.com/c4milo/chapulin/issues/107).
        run: make lint-wide-multiply-gcc WIDEMUL_GCC="$HOME/rv32tc/bin/riscv32-linux-gcc"
      - run: make cross-check CROSS="$HOME/rv32tc/bin/riscv32-linux-" RUNNER=qemu-riscv32

  # `make check` and nothing after it: every lint, each packaged-object leg
  # and each test binary's run. Of the four jobs from here down it is the
  # one a pull request gets, and its id is a required status check
  # (.github/required-status-checks.txt).
  #
  # The slow, mutants and prove jobs below run check-slow's other steps
  # beside this one, each on a runner of its own, on every event but a
  # pull request. One job used to run the four parts in a row. On run
  # 37167172750 that took 48 minutes with no proof to redo: 4 of
  # installs, 11.6 of `make check`, 8 of the slow job's steps and 24.6 of
  # the mutants. On run 37162739426 it took 83, 41 of them proofs. Run
  # 37178050965, the first with the four jobs, finished in 33 minutes,
  # the time its prove job took to prove 94 harnesses again. The comment
  # at the Makefile's ci target lists the target each job runs.
  check:
    runs-on: ubuntu-24.04
    # The PR-lane budget. `make check` costs a minute on a development
    # machine and took 11.6 here, because CI keeps no stamps and so skips
    # no lint. If this job starts approaching the cap, move work to the
    # nightly workflow rather than raising it.
    timeout-minutes: 45
    env:
      # Only the install paths live here. Every version comes from
      # tools/toolchain.env, which the Makefile includes and the load-pins
      # action below appends to the job environment, so a runner and a
      # development machine resolve the same pins from the same line. The
      # version numbers used to sit in this block and nowhere else, which
      # meant they applied on CI and not locally.
      SHELLCHECK: /home/runner/shellcheck-inst/shellcheck
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # commitlint lints commit ranges, not just HEAD

      - name: Audit main's required status checks
        # Settings > Branches decides which checks must pass before a merge,
        # and no diff shows that setting change. .github/required-status-checks.txt
        # records the set. This step reads the live set through the API and
        # fails when the two differ, or when a required name is not a job id
        # in this file: a renamed job would otherwise leave main waiting on a
        # check that never reports, and a job added here would run without
        # blocking a merge. https://github.com/c4milo/chapulin/issues/91
        #
        # The branch endpoint, not branches/main/protection: that one needs
        # repository administration, which no GITHUB_TOKEN can hold, while
        # the branch object carries required_status_checks for any reader of
        # a public repository, so the job's read-only token is enough. The
        # repository uses classic branch protection and no rulesets, so
        # rules/branches/main returns nothing today; a move to rulesets
        # empties this read and fails the step, which is the signal to read
        # that endpoint instead.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          roster=.github/required-status-checks.txt
          workflow=.github/workflows/check.yml
          want=$(sed 's/#.*//; s/[[:space:]]*$//; /^$/d' "$roster" | sort -u)
          live=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" \
            --jq '.protection.required_status_checks.checks // [] | .[].context' | sort -u)
          # Job ids sit at two-space indent under jobs:, which is how YAML
          # delimits them. A job-level name: key would replace the id as the
          # context name, so none may exist while this matches on ids.
          jobs=$(awk '/^jobs:/ { in_jobs = 1; next }
                      in_jobs && /^[^ #]/ { in_jobs = 0 }
                      in_jobs && /^  [A-Za-z0-9_-]+:/ { sub(/:.*/, ""); sub(/^  /, ""); print }' \
                   "$workflow" | sort -u)
          echo "roster ($roster): $(paste -sd ' ' - <<< "$want")"
          echo "live (Settings > Branches > main): $(paste -sd ' ' - <<< "$live")"
          rc=0
          if [ -z "$want" ]; then
            echo "::error file=$roster::the roster is empty; main must require at least one check"
            rc=1
          fi
          if [ "$want" != "$live" ]; then
            echo "::error file=$roster::main's required status checks differ from the roster; change Settings or this file so they agree"
            rc=1
          fi
          if grep -nE '^    name:' "$workflow"; then
            echo "::error file=$workflow::a job-level name: replaces the job id as the check's context name, and this audit matches on ids"
            rc=1
          fi
          while read -r name; do
            [ -n "$name" ] || continue
            grep -qxF "$name" <<< "$jobs" \
              || { echo "::error file=$roster::$name is required but is not a job in $workflow"; rc=1; }
          done <<< "$want"
          unrequired=$(comm -23 <(printf '%s\n' "$jobs") <(printf '%s\n' "$want") | paste -sd ' ' -)
          [ -z "$unrequired" ] || echo "::notice::jobs in $workflow that main does not require: $unrequired"
          exit "$rc"

      - uses: ./.github/actions/load-pins

      # This job installs what `make check` reads and no more. The slow
      # job installs Go, OpenSSL and qemu-system-arm, which test/e2e.sh
      # and test/qemu-m3.sh read. The mutants job installs the Arm GNU gcc,
      # which one catch target reads. The prove job installs kissat and
      # restores the proof cache.
      - name: Install clang tools (apt.llvm.org, pinned major)
        uses: ./.github/actions/install-llvm
        with:
          major: ${{ env.LLVM_MAJOR }}
          sha256: ${{ env.LLVM_SH_SHA256 }}
          clang-tidy: "true"
          clang-format: "true"
          llvm: "true" # llvm-nm, which lint-runtime-symbols reads with

      - name: Install Zig (pinned)
        # make lint-zig-build builds the object with build.zig and holds it
        # to make's, and make lint-toolchain holds zig to its pin.
        uses: ./.github/actions/install-zig
        with:
          version: ${{ env.ZIG_VERSION }}
          sha256: ${{ env.ZIG_LINUX_X86_64_SHA256 }}

      - name: Install cppcheck (pinned)
        uses: ./.github/actions/install-cppcheck
        with:
          version: ${{ env.CPPCHECK_VERSION }}
          sha256: ${{ env.CPPCHECK_SHA256 }}

      - name: Cache shellcheck
        id: shellcheck-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/shellcheck-inst
          key: shellcheck-${{ runner.os }}-${{ env.SHELLCHECK_VERSION }}-inst

      - name: Install shellcheck at the pinned version
        if: steps.shellcheck-cache.outputs.cache-hit != 'true'
        # The project ships a static binary, so there is nothing to build.
        # The tarball is checked against the pinned hash before it is
        # unpacked.
        run: |
          mkdir -p "$HOME/shellcheck-inst"
          tarball="shellcheck-v$SHELLCHECK_VERSION.linux.x86_64.tar.xz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" "https://github.com/koalaman/shellcheck/releases/download/v$SHELLCHECK_VERSION/$tarball"
          echo "$SHELLCHECK_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar xJf "$RUNNER_TEMP/$tarball" -C "$HOME/shellcheck-inst" --strip-components=1 \
            "shellcheck-v$SHELLCHECK_VERSION/shellcheck"

      - name: Lint the workflows
        # make lint-shellcheck covers the scripts in bench/, proof/ and test/,
        # and the install scripts under .github/actions/. Nothing covered the
        # shell inside these workflow files until this, and actionlint found
        # a real defect there: backticks in a double-quoted echo, which the
        # shell runs as a command. It also checks each `with:` block against
        # the inputs the local action under .github/actions/ declares. It
        # lives here rather than in make check because that target must not
        # need a Go binary to build a C library.
        #
        # The tarball is checked against the published checksum before it runs.
        run: |
          set -euo pipefail
          url="https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION"
          curl -fsSLO "$url/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | sha256sum -c -
          tar xzf "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" actionlint
          ./actionlint .github/workflows/*.yml
          echo "actionlint: every workflow clean"

      - name: Check tool versions match the pins
        # Assert, do not print. The clang tools are installed by
        # versioned name, so an edit that set CLANG_TIDY to the
        # unversioned binary would silently lint with whatever the
        # runner ships while this step still passed.
        run: |
          "$CLANG_TIDY" --version | grep -qE "version $LLVM_MAJOR\\." \
            || { echo "clang-tidy is not the pinned LLVM $LLVM_MAJOR"; exit 1; }
          "$CLANG_FORMAT" --version | grep -qE "version $LLVM_MAJOR\\." \
            || { echo "clang-format is not the pinned LLVM $LLVM_MAJOR"; exit 1; }
          "$CPPCHECK" --version | grep -qF "$CPPCHECK_VERSION" \
            || { echo "cppcheck is not the pinned $CPPCHECK_VERSION"; exit 1; }
          "$CLANG_RV" --version | grep -qE "version $LLVM_MAJOR\\." \
            || { echo "CLANG_RV is not the pinned LLVM $LLVM_MAJOR"; exit 1; }
          "$SHELLCHECK" --version | grep -qF "version: $SHELLCHECK_VERSION" \
            || { echo "shellcheck is not the pinned $SHELLCHECK_VERSION"; exit 1; }
          [ "$(zig version)" = "$ZIG_VERSION" ] \
            || { echo "zig is not the pinned $ZIG_VERSION"; exit 1; }
          # lint-runtime-symbols reads the rv32ic objects with this. Assert it
          # here so a missing package names itself instead of surfacing as an
          # empty symbol list inside make.
          command -v "llvm-nm-$LLVM_MAJOR" >/dev/null || command -v llvm-nm >/dev/null \
            || { echo "llvm-nm is missing; install llvm-$LLVM_MAJOR"; exit 1; }

      - name: Install semgrep (hash-pinned)
        # The only pip package in the security path, so it installs
        # from the hash-pinned requirements file. lint-invariants runs
        # it with local rules and --metrics=off only.
        run: pip install --require-hashes -r .semgrep/requirements.txt

      - name: Install CBMC
        # check runs no proof. Its proof-reach-smoke runs one cbmc cover
        # pass, on the epoch harness, under cbmc's own solver, so this job
        # installs no kissat.
        uses: ./.github/actions/install-cbmc
        with:
          version: ${{ env.CBMC_VERSION }}
          sha256: ${{ env.CBMC_DEB_SHA256 }}

      - name: Cache Lean toolchain and spec build
        # spec/ depends on Mathlib (spec/lean/lakefile.toml). Mathlib's compiled
        # files are 6.5 GB unpacked, this key has two families (this
        # workflow's and the nightly's), and GitHub allots 10 GB of cache to
        # the whole repository, so the files stay out of the cache: the
        # fetch-mathlib step below downloads them each run, 440 MB, with
        # the command Mathlib publishes for it. The cache holds elan's
        # toolchain and the Spec library's own build, 44 MB. The key names
        # spec/*.lean and spec/lean/Spec/*.lean rather than spec/**/*.lean,
        # which would also hash the 9,500 .lean files of the packages under
        # spec/lean/.lake once they are on disk.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.elan
            spec/lean/.lake/build
          key: lean-${{ runner.os }}-${{ hashFiles('spec/lean/lean-toolchain', 'spec/lean/lakefile.toml', 'spec/lean/lake-manifest.json', 'spec/lean/*.lean', 'spec/lean/Spec/*.lean') }}
          restore-keys: lean-${{ runner.os }}-

      - name: Cache npm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('tools/package-lock.json', 'tools/package.json') }}

      - name: Install elan
        uses: ./.github/actions/install-elan
        with:
          sha256: ${{ env.ELAN_INIT_SHA256 }}

      - name: Download Mathlib's compiled files
        # After install-elan, which puts lake on PATH. Without these files
        # lint-spec's lake build would compile Mathlib from source; the
        # Makefile's REQUIRE_MATHLIB fails by name instead.
        uses: ./.github/actions/fetch-mathlib

      - run: npm ci
        working-directory: tools

      - name: Lint pushed commits
        # make check re-lints from the root; this pins any failure to the
        # commits under review when a base exists. The range logic lives in
        # the Makefile so this step cannot drift from it: an inline copy is
        # what broke when commitlint moved under tools/.
        run: make lint-commits-range

      - run: make hooks

      # One target, so the workflow holds no list of what check runs.
      #
      # check runs each lint, leg and test run as a prerequisite of its
      # own, so -j runs them side by side on the runner's cores. Serial,
      # check took 522 s of this job on run 36228452875.
      - run: make -j"$(nproc)" check
      - name: Render what CBMC proves on the run page
        # check's proof-coverage writes bin/proof-coverage.md, so the table
        # renders here. The prove job runs the proofs and writes no table.
        if: always()
        run: cat bin/proof-coverage.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

  # `make ci-slow`: the unit, ML-KEM, P-256 and Wycheproof vectors over the
  # decomposed multiply, build.zig over every lib-check leg's
  # configuration, the crypto on an emulated Cortex-M3, e2e against real
  # servers, the spec differential and the sequence enumeration. Those
  # steps took 8 minutes of run 37167172750's check job, where check had
  # built the binaries e2e runs. Here the target builds them first, and
  # it took 8.7 minutes of run 37178050965.
  #
  # The job installs every tool a step of ci-slow reads and no other. On
  # CI a step fails where its tool is missing, and skips only on a
  # development machine: the Makefile's REQUIRE_ON_CI holds that for lake
  # and for the Wycheproof fetch, and test/qemu-m3.sh, test/e2e.sh and
  # test/zig-build-check.sh hold it for what they read.
  slow:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/load-pins

      - name: Install Go (pinned)
        # test/e2e.sh builds test/goecho with it, the crypto/tls server of
        # its go legs.
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install clang (apt.llvm.org, pinned major)
        # test/qemu-m3.sh compiles for the Cortex-M3 with the pinned clang
        # and links with the ld.lld-<major> that llvm.sh installs beside it.
        uses: ./.github/actions/install-llvm
        with:
          major: ${{ env.LLVM_MAJOR }}
          sha256: ${{ env.LLVM_SH_SHA256 }}

      - name: Install qemu-system-arm
        # test/qemu-m3.sh runs the crypto on an emulated Cortex-M3. On CI
        # the script fails where its emulator or its linker is missing, so
        # no run skips it: the check job skipped it until the script
        # looked for the ld.lld that llvm.sh installs, ld.lld-<major>, and
        # meanwhile its Cortex-M3 build stopped compiling unseen
        # (docs/invariants.md, INV-40).
        run: sudo apt-get update -q && sudo apt-get install -y -q qemu-system-arm

      - name: Install Zig (pinned)
        # test/zig-build-check.sh --roster builds each lib-check leg's
        # object with build.zig and holds it to make's.
        uses: ./.github/actions/install-zig
        with:
          version: ${{ env.ZIG_VERSION }}
          sha256: ${{ env.ZIG_LINUX_X86_64_SHA256 }}

      - name: Build the pinned OpenSSL and put it on PATH
        # test/e2e.sh needs options the runner's OpenSSL 3.0 lacks; the
        # action states which.
        uses: ./.github/actions/install-openssl
        with:
          version: ${{ env.OPENSSL_VERSION }}
          sha256: ${{ env.OPENSSL_SHA256 }}

      - name: Cache Lean toolchain and spec build
        # make diff and make handshake-sequence compare the C against the
        # spec's oracle, which lake builds. The key is the check job's.
        # That job's step of the same name states why Mathlib's compiled
        # files stay out of this cache and a later step downloads them.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.elan
            spec/lean/.lake/build
          key: lean-${{ runner.os }}-${{ hashFiles('spec/lean/lean-toolchain', 'spec/lean/lakefile.toml', 'spec/lean/lake-manifest.json', 'spec/lean/*.lean', 'spec/lean/Spec/*.lean') }}
          restore-keys: lean-${{ runner.os }}-

      - name: Install elan
        uses: ./.github/actions/install-elan
        with:
          sha256: ${{ env.ELAN_INIT_SHA256 }}

      - name: Download Mathlib's compiled files
        uses: ./.github/actions/fetch-mathlib

      - name: Check tool versions match the pins
        # lint-toolchain's version check is check's, and ci-slow's steps
        # run without it. The runner image carries a Go and an OpenSSL of
        # its own, so assert that the ones on PATH are the pinned ones, and
        # the same for the clang, its linker and zig.
        run: |
          "$CLANG_RV" --version | grep -qE "version $LLVM_MAJOR\\." \
            || { echo "CLANG_RV is not the pinned LLVM $LLVM_MAJOR"; exit 1; }
          command -v "ld.lld-$LLVM_MAJOR" >/dev/null \
            || { echo "ld.lld-$LLVM_MAJOR is missing; llvm.sh installs it beside clang"; exit 1; }
          go version | grep -qF "go$GO_VERSION " \
            || { echo "go is not the pinned $GO_VERSION"; exit 1; }
          [ "$(zig version)" = "$ZIG_VERSION" ] \
            || { echo "zig is not the pinned $ZIG_VERSION"; exit 1; }
          openssl version | grep -qF "OpenSSL $OPENSSL_VERSION " \
            || { echo "openssl is not the pinned $OPENSSL_VERSION"; exit 1; }

      # One target: the Makefile holds the list of steps. -j builds the
      # target's binaries side by side, and its steps then run one after
      # another.
      - run: make -j"$(nproc)" ci-slow

  # `make ci-mutants`, the fast tier of test/violations/: each violation
  # breaks one rule in a copy of the tree, and its catch target must
  # fail. On two workers (test/violations.py --jobs, half the runner's
  # cores) it took 24.6 minutes of run 37167172750's check job, and 20 of
  # run 37178050965 as this job.
  #
  # A catch target runs one lint or one script alone, without
  # lint-toolchain's version check. Where this job lacked a tool, the
  # target would read the runner image's tool of another version, or fail
  # on unedited source. So the job installs every tool a fast-tier catch
  # target reads (FAST_TARGETS in test/violations.py), as the nightly's
  # test-invariants job does for the whole set. clang-tidy, cppcheck,
  # OpenSSL, Go and lake are read by slow-tier targets alone, so the
  # nightly's job installs them and this one does not.
  mutants:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/load-pins

      - name: Install the Arm GNU toolchain (pinned)
        # The gcc codegen check (test/lint-wide-multiply-gcc.sh) is a catch
        # target and needs the Arm GNU gcc the m3 lane pins.
        uses: ./.github/actions/install-arm-gnu
        with:
          version: ${{ env.ARM_GNU_VERSION }}
          sha256: ${{ env.ARM_GNU_LINUX_SHA256 }}
      - name: Put the Arm GNU gcc on PATH
        # test/violations.py runs test/lint-wide-multiply-gcc.sh with no
        # arguments, and the Makefile resolves that check's gcc through
        # M3_CC's PATH lookup, so the toolchain goes on PATH rather than
        # being passed as a make variable. The inv16-widemul-mid-widened
        # violation is the one only that check catches
        # (https://github.com/c4milo/chapulin/issues/106).
        run: echo "$HOME/armtc/bin" >> "$GITHUB_PATH"

      - name: Install clang tools (apt.llvm.org, pinned major)
        # The pinned clang compiles for the catch targets that read what a
        # compiler emits (test/lint-wide-multiply.sh,
        # test/lint-runtime-symbols.sh, test/lint-stack-walk.sh) and for
        # the ones that build for another target (test/quic-builds.sh,
        # test/chacha-builds.sh). llvm-<major> carries llvm-nm,
        # llvm-objdump, llvm-objcopy and llvm-readelf, which
        # test/lint-runtime-symbols.sh, test/lint-stack-walk.sh and
        # test/localize-check.sh read objects with.
        uses: ./.github/actions/install-llvm
        with:
          major: ${{ env.LLVM_MAJOR }}
          sha256: ${{ env.LLVM_SH_SHA256 }}
          llvm: "true"

      - name: Install Zig (pinned)
        # test/zig-build-check.sh, test/localize-check.sh and
        # test/tx-record-builds.sh are catch targets, and each runs zig
        # from PATH.
        uses: ./.github/actions/install-zig
        with:
          version: ${{ env.ZIG_VERSION }}
          sha256: ${{ env.ZIG_LINUX_X86_64_SHA256 }}

      - name: Install semgrep (hash-pinned)
        # test/lint-invariants.sh is a catch target. Without semgrep the
        # Makefile's REQUIRE fires, the script exits 2 on unedited source,
        # and violations.py reports ERROR rather than a verdict. The check
        # job installs it the same way.
        run: pip install --require-hashes -r .semgrep/requirements.txt

      - name: Check tool versions match the pins
        # lint-wide-multiply and lint-runtime-symbols check their own
        # clang and llvm-nm (the Makefile's REQUIRE_PINNED). The other
        # catch targets run the same tools unchecked, and zig and the Arm
        # GNU gcc from PATH, so assert all four here.
        run: |
          "$CLANG_RV" --version | grep -qE "version $LLVM_MAJOR\\." \
            || { echo "CLANG_RV is not the pinned LLVM $LLVM_MAJOR"; exit 1; }
          "llvm-nm-$LLVM_MAJOR" --version | grep -qE "version $LLVM_MAJOR\\." \
            || { echo "llvm-nm is not the pinned LLVM $LLVM_MAJOR"; exit 1; }
          [ "$(zig version)" = "$ZIG_VERSION" ] \
            || { echo "zig is not the pinned $ZIG_VERSION"; exit 1; }
          [ "$(command -v arm-none-eabi-gcc)" = "$HOME/armtc/bin/arm-none-eabi-gcc" ] \
            || { echo "arm-none-eabi-gcc on PATH is not the pinned toolchain's"; exit 1; }

      # One target. test-invariants-fast, which it names, runs one
      # violation per worker itself (test/violations.py --jobs), and -j
      # gives the builds under those workers the runner's cores.
      - run: make -j"$(nproc)" ci-mutants

  # `make ci-prove`, the fast tier of the CBMC proofs. proof/run.sh skips
  # a harness whose content key already recorded a success. So the tier
  # took 2 seconds of run 37167172750's check job, which found all 116
  # harnesses recorded, and 41 minutes of run 37162739426's, which proved
  # 106 of them again after an edit to headers they read. The slow tier
  # runs in the nightly workflow, one job per harness.
  prove:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    # A run this cap stops still saves its cache below, so the next run
    # proves only the harnesses this one did not finish.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/load-pins

      - name: Install CBMC
        uses: ./.github/actions/install-cbmc
        with:
          version: ${{ env.CBMC_VERSION }}
          sha256: ${{ env.CBMC_DEB_SHA256 }}

      - name: Build and install kissat at the development version
        # proof/run.sh takes kissat as the SAT back end when it is on PATH,
        # and the fast tier's timings are kissat's: under cbmc's own solver
        # the ServerHello parser returned no verdict in 131 minutes.
        uses: ./.github/actions/install-kissat
        with:
          version: ${{ env.KISSAT_VERSION }}
          sha256: ${{ env.KISSAT_SHA256 }}

      # proof/run.sh skips any harness whose content key already recorded
      # a success; restoring the marker directory makes CI incremental
      # the same way development machines are.
      - name: Restore proof cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: proof/.cache
          key: proofs-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: proofs-${{ runner.os }}-

      # One target. proof/run.sh schedules the proofs by its memory budget,
      # so the step takes no -j.
      - run: make ci-prove

      # Save even on failure or timeout (always() runs on cancelled jobs):
      # every verified harness has already recorded its key, so the next
      # run re-proves only what this one did not finish. A timed-out cold
      # run therefore converges over a couple of pushes instead of
      # starting from zero each time.
      - name: Save proof cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: proof/.cache
          key: proofs-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      # A failed proof's one-line verdict is not diagnosable from the run
      # output alone; keep the full solver logs.
      - name: Upload proof logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proof-results
          path: proof/results/
          if-no-files-found: ignore
