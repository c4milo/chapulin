name: check

on:
  push:
    branches: [main] # branch pushes get checked via their PR run
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    # `make prove` (CBMC over every harness) dominates the wall clock.
    timeout-minutes: 90
    env:
      # CI runs the same tool versions as development. When the local
      # toolchain upgrades, bump these pins in the same commit — never
      # adapt the code to an older checker. The Makefile's ?= picks
      # these up.
      LLVM_MAJOR: 22
      CLANG_TIDY: clang-tidy-22
      CLANG_FORMAT: clang-format-22
      CPPCHECK_VERSION: 2.21.0
      CPPCHECK: /home/runner/cppcheck-inst/bin/cppcheck
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # commitlint lints commit ranges, not just HEAD

      - name: Install clang tools (apt.llvm.org, pinned major)
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh "$LLVM_MAJOR"
          sudo apt-get install -y "clang-tidy-$LLVM_MAJOR" "clang-format-$LLVM_MAJOR"

      - name: Cache cppcheck install
        id: cppcheck-cache
        uses: actions/cache@v4
        with:
          path: ~/cppcheck-inst
          key: cppcheck-${{ runner.os }}-${{ env.CPPCHECK_VERSION }}-inst

      - name: Build and install cppcheck at the development version
        if: steps.cppcheck-cache.outputs.cache-hit != 'true'
        # Install into a cached prefix with FILESDIR baked to that prefix,
        # so cppcheck finds std.cfg and the other cfg files at runtime.
        run: |
          curl -fsSL "https://github.com/danmar/cppcheck/archive/refs/tags/$CPPCHECK_VERSION.tar.gz" | tar xz
          cmake -S "cppcheck-$CPPCHECK_VERSION" -B cppcheck-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$HOME/cppcheck-inst" \
            -DFILESDIR="$HOME/cppcheck-inst/share/Cppcheck" >/dev/null
          cmake --build cppcheck-build -j"$(nproc)" >/dev/null
          cmake --install cppcheck-build >/dev/null

      - name: Check tool versions match the pins
        run: |
          "$CLANG_TIDY" --version
          "$CLANG_FORMAT" --version
          "$CPPCHECK" --version | grep -F "$CPPCHECK_VERSION"

      - name: Install CBMC
        run: |
          curl -fsSLO https://github.com/diffblue/cbmc/releases/download/cbmc-6.10.0/ubuntu-24.04-cbmc-6.10.0-Linux.deb
          sudo dpkg -i ubuntu-24.04-cbmc-6.10.0-Linux.deb
          cbmc --version

      - name: Cache kissat install
        uses: actions/cache@v4
        with:
          path: ~/kissat-inst
          key: kissat-${{ runner.os }}-rel-4.0.4

      - name: Build and install kissat at the development version
        # proof/run.sh uses kissat as the SAT back end when present;
        # verdicts are solver-independent, kissat just gets there faster.
        # Not in the runner's apt archive, so build the pinned release —
        # a dependency-free C build that takes seconds.
        run: |
          if [ ! -x ~/kissat-inst/kissat ]; then
            curl -fsSL https://github.com/arminbiere/kissat/archive/refs/tags/rel-4.0.4.tar.gz | tar xz
            cd kissat-rel-4.0.4
            ./configure
            make -j"$(nproc)"
            mkdir -p ~/kissat-inst
            cp build/kissat ~/kissat-inst/
          fi
          echo "$HOME/kissat-inst" >> "$GITHUB_PATH"
          ~/kissat-inst/kissat --version

      - name: Cache Lean toolchain and spec build
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            spec/.lake
          key: lean-${{ runner.os }}-${{ hashFiles('spec/lean-toolchain', 'spec/lakefile.toml', 'spec/lake-manifest.json') }}
          restore-keys: lean-${{ runner.os }}-

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json', 'package.json') }}

      - name: Install elan
        # --default-toolchain none: lake installs the spec/lean-toolchain
        # pin itself, so elan-init needn't pull an unused stable release.
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - run: npm ci

      - name: Lint pushed commits
        # make check re-lints from the root; this pins any failure to the
        # commits under review when a base exists. On main (HEAD is on
        # origin/main) fall back to the full history.
        run: |
          if git rev-parse -q --verify origin/main >/dev/null \
             && ! git merge-base --is-ancestor HEAD origin/main; then
            npx --no-install commitlint --from origin/main --to HEAD
          else
            npx --no-install commitlint --from "$(git rev-list --max-parents=0 HEAD)" --to HEAD
          fi

      - run: make hooks

      - run: make check

      # The four SAT heavyweights; the fast proof tier already ran in check.
      - name: Slow-tier proofs
        run: make prove-slow
