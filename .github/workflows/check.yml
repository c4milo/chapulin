name: check

on:
  push:
    branches: [main] # branch pushes get checked via their PR run
  pull_request:
  # The slow half runs on merges to main and here. A pull request gets the
  # one-minute check only, so review stays fast; main and the nightly get
  # everything.
  schedule:
    - cron: "47 2 * * *"
  workflow_dispatch: # rerun the PR lane on demand; the nightly workflow has its own

# One run per branch: a new push supersedes older runs. Cancelled runs
# still execute their always() cache save, so no proof work is lost.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true


# Every job runs on a read-only token unless it says otherwise; the
# coverage job raises its own. Stated so nothing rides the implicit
# default, which is what the scanner flags.
permissions:
  contents: read
jobs:
  # Fast signal while the proof tiers grind: line coverage over the
  # library sources, five host binaries x two PIN builds, gated on the
  # Makefile's COVERAGE_FLOOR. No proofs, no e2e, minutes not hours.
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The badge step pushes the regenerated SVG to the badges branch; the
    # default token is read-only, so this job alone gets write. The
    # check job keeps the read-only default.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The one job with a write token is also the one that installs
          # pip packages. checkout would write the token to .git/config,
          # where `make coverage` and every package it imports could
          # read it. This keeps it out of .git/config: the badge step
          # below is the only push, and it reads the token from its own
          # env.
          persist-credentials: false
      - name: Install gcovr (hash-pinned)
        # gcovr and its dependencies install from a hash-pinned
        # requirements file, as semgrep does in the check job: a package
        # substituted on the index would otherwise run in the one job
        # that holds a write token. pip-compile --generate-hashes wrote
        # the file, and its header records the command.
        run: pip install --require-hashes -r tools/coverage-requirements.txt
      - run: make coverage
      - name: Render the coverage tables on the run page
        if: always()
        run: cat bin/coverage.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - name: Update the coverage badge branch
        # The badge is a generated SVG on its own orphan branch, so the
        # job never pushes to main: branch protection now requires a
        # green check on every main SHA, which a fresh bot commit cannot
        # carry, and a bypass would re-open the push-to-main surface the
        # protection closed. README links the badge from this branch.
        if: github.ref == 'refs/heads/main'
        env:
          # The write token, in this step's env and nowhere else in the
          # job. checkout stored nothing (persist-credentials above), so
          # the push carries the token in its URL. git prints a URL
          # without its credentials, and the runner masks the token.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 tools/coverage-badge.py bin/coverage.json > /tmp/coverage.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The fetch is anonymous: the repository is public, and only
          # the push needs the token.
          if git fetch origin badges 2>/dev/null; then
            git switch badges
          else
            git switch --orphan badges
          fi
          mkdir -p .github/badges
          cp /tmp/coverage.svg .github/badges/coverage.svg
          if ! git diff --quiet -- .github/badges/coverage.svg 2>/dev/null \
              || ! git ls-files --error-unmatch .github/badges/coverage.svg >/dev/null 2>&1; then
            git add .github/badges/coverage.svg
            git commit -m "chore: update the coverage badge"
            git push "https://x-access-token:$GITHUB_TOKEN@github.com/$GITHUB_REPOSITORY" badges
          fi
      - name: Annotate a floor breach
        if: failure()
        run: echo "::error file=Makefile::coverage fell below COVERAGE_FLOOR; add tests or move the floor down in the same diff with the reason in the commit message"
      - name: Upload the HTML report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-html
          path: bin/cov/html/
          if-no-files-found: ignore

  # ASan + UBSan over the deterministic suites at -O2, the level that
  # ships; the nightly runs the same suites at -O0, where UBSan sees
  # code the optimizer would delete. The committed canary in
  # test/san_selftest.c proves on every run that the sanitizer is
  # armed.
  san:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make san-check SAN=1 O=2

  # The deployment ISA: big-endian mips32r2 under qemu-user. Every
  # byte-exact suite (RFC 8448 traces, Wycheproof, unit vectors) must
  # pass on the target's byte order and code generation, not only on
  # the x86-64 the other jobs run.
  mips:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update -q && sudo apt-get install -y -q gcc-mips-linux-gnu qemu-user
      - name: Count wide multiplies and divisions under the mips gcc
        # lint-wide-multiply in the check job measures clang. This lane
        # ships gcc, whose lowering is its own measurement: it once put
        # a widening multiply back where clang did not
        # (https://github.com/c4milo/chapulin/issues/106). The Makefile
        # picks the spec from the driver's -dumpmachine and fails when
        # none matches, so this step cannot measure nothing.
        run: make lint-wide-multiply-gcc WIDEMUL_GCC=mips-linux-gnu-gcc
      - run: make cross-check CROSS=mips-linux-gnu- RUNNER=qemu-mips

  arm64:
    # linux arm64 as a supported platform: the whole deterministic
    # suite roster, built with the runner's own gcc and run natively.
    # Lints stay with the amd64 check job — duplicating that toolchain
    # buys no platform coverage.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make suite-check

  m3:
    # Cortex-M3 as a supported platform: the cross-check roster on
    # QEMU's MPS2-AN385 through newlib semihosting (make m3-check).
    # The Arm GNU toolchain is pinned in tools/toolchain.env and
    # cached by that version.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/load-pins
      - run: sudo apt-get update -q && sudo apt-get install -y -q qemu-system-arm
      # No clang-tidy here: make m3-check runs none. The freertos job
      # installs it because freertos-check lints its test programs.
      - name: Install the Arm GNU toolchain (pinned)
        uses: ./.github/actions/install-arm-gnu
        with:
          version: ${{ env.ARM_GNU_VERSION }}
          sha256: ${{ env.ARM_GNU_LINUX_SHA256 }}
      - name: Count wide multiplies and divisions under the Arm gcc
        # lint-wide-multiply in the check job measures clang. This lane
        # ships the gcc a firmware tree ships, and gcc once fused ct.h's
        # 16x16 pieces back into umlal and umull where clang kept them
        # apart (https://github.com/c4milo/chapulin/issues/106); the
        # Makefile holds every file at zero under it. The spec is picked
        # from the driver's -dumpmachine and no match fails, so this step
        # cannot measure nothing.
        run: make lint-wide-multiply-gcc WIDEMUL_GCC="$HOME/armtc/bin/arm-none-eabi-gcc"
      - run: make m3-check M3_CC="$HOME/armtc/bin/arm-none-eabi-gcc"

  freertos:
    # FreeRTOS as a supported platform, first rung: the pinned kernel
    # boots on QEMU's MPS2-AN385 and two static tasks must interleave
    # before PASS. Same Arm toolchain as the m3 job, same cache.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/load-pins
      - run: sudo apt-get update -q && sudo apt-get install -y -q qemu-system-arm
      - name: Install clang-tidy (apt.llvm.org, pinned major)
        # freertos-check lints its test programs against the fetched
        # kernel headers, so the lane needs the same pinned clang-tidy
        # the check job runs.
        uses: ./.github/actions/install-llvm
        with:
          major: ${{ env.LLVM_MAJOR }}
          sha256: ${{ env.LLVM_SH_SHA256 }}
          clang-tidy: "true"
      - name: Install the Arm GNU toolchain (pinned)
        uses: ./.github/actions/install-arm-gnu
        with:
          version: ${{ env.ARM_GNU_VERSION }}
          sha256: ${{ env.ARM_GNU_LINUX_SHA256 }}
      - run: make freertos-check M3_CC="$HOME/armtc/bin/arm-none-eabi-gcc"

  riscv32:
    # riscv32 as a supported platform: the cross-check roster under
    # qemu-riscv32 user mode, the mips job's own shape. apt carries no
    # riscv32 cross compiler with a libc, so the toolchain is Bootlin's,
    # pinned in tools/toolchain.env by the publisher's sha256 and cached
    # by version. Its libc is ilp32d, so the lane runs the toolchain's
    # own ABI; rv32imac codegen is gated separately by lint-wide-multiply
    # under clang in the check job and under this gcc in the step below,
    # which also measures rv32ic, the core with no multiplier.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/load-pins
      - run: sudo apt-get update -q && sudo apt-get install -y -q qemu-user
      - name: Install the Bootlin toolchain (pinned)
        uses: ./.github/actions/install-rv32
        with:
          version: ${{ env.RV32_TC_VERSION }}
          sha256: ${{ env.RV32_TC_SHA256 }}
      - name: Count wide multiplies and divisions under the riscv32 gcc
        # lint-wide-multiply in the check job measures clang for
        # rv32imac; this is the same count under the gcc this lane ships
        # (https://github.com/c4milo/chapulin/issues/86). The Makefile
        # picks the specs from the driver's -dumpmachine and fails when
        # none matches, so this step cannot measure nothing. Two match
        # this driver: rv32imac, and rv32ic, where softmul.c compiles and
        # is held at zero calls to __muldi3 -- gcc at -Os once emitted
        # one from inside __muldi3 itself
        # (https://github.com/c4milo/chapulin/issues/107).
        run: make lint-wide-multiply-gcc WIDEMUL_GCC="$HOME/rv32tc/bin/riscv32-linux-gcc"
      - run: make cross-check CROSS="$HOME/rv32tc/bin/riscv32-linux-" RUNNER=qemu-riscv32

  check:
    runs-on: ubuntu-24.04
    # The PR-lane budget. This job is the long one: it lands between 10
    # minutes on a warm proof cache and around 35 cold, so the cap sits
    # at 45 rather than close to the median. The slow proof tier lives
    # in the nightly workflow; if this job starts approaching the cap,
    # move work there rather than raising it.
    timeout-minutes: 180 # the slow half runs here on main and nightly
    env:
      # Only the install paths live here. Every version comes from
      # tools/toolchain.env, which the Makefile includes and the load-pins
      # action below appends to the job environment, so a runner and a
      # development machine resolve the same pins from the same line. The
      # version numbers used to sit in this block and nowhere else, which
      # meant they applied on CI and not locally.
      CPPCHECK: /home/runner/cppcheck-inst/bin/cppcheck
      SHELLCHECK: /home/runner/shellcheck-inst/shellcheck
      OPENSSL_PREFIX: /home/runner/openssl-inst
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # commitlint lints commit ranges, not just HEAD

      - name: Audit main's required status checks
        # Settings > Branches decides which checks must pass before a merge,
        # and no diff shows that setting change. .github/required-status-checks.txt
        # records the set. This step reads the live set through the API and
        # fails when the two differ, or when a required name is not a job id
        # in this file: a renamed job would otherwise leave main waiting on a
        # check that never reports, and a job added here would run without
        # blocking a merge. https://github.com/c4milo/chapulin/issues/91
        #
        # The branch endpoint, not branches/main/protection: that one needs
        # repository administration, which no GITHUB_TOKEN can hold, while
        # the branch object carries required_status_checks for any reader of
        # a public repository, so the job's read-only token is enough. The
        # repository uses classic branch protection and no rulesets, so
        # rules/branches/main returns nothing today; a move to rulesets
        # empties this read and fails the step, which is the signal to read
        # that endpoint instead.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          roster=.github/required-status-checks.txt
          workflow=.github/workflows/check.yml
          want=$(sed 's/#.*//; s/[[:space:]]*$//; /^$/d' "$roster" | sort -u)
          live=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" \
            --jq '.protection.required_status_checks.checks // [] | .[].context' | sort -u)
          # Job ids sit at two-space indent under jobs:, which is how YAML
          # delimits them. A job-level name: key would replace the id as the
          # context name, so none may exist while this matches on ids.
          jobs=$(awk '/^jobs:/ { in_jobs = 1; next }
                      in_jobs && /^[^ #]/ { in_jobs = 0 }
                      in_jobs && /^  [A-Za-z0-9_-]+:/ { sub(/:.*/, ""); sub(/^  /, ""); print }' \
                   "$workflow" | sort -u)
          echo "roster ($roster): $(paste -sd ' ' - <<< "$want")"
          echo "live (Settings > Branches > main): $(paste -sd ' ' - <<< "$live")"
          rc=0
          if [ -z "$want" ]; then
            echo "::error file=$roster::the roster is empty; main must require at least one check"
            rc=1
          fi
          if [ "$want" != "$live" ]; then
            echo "::error file=$roster::main's required status checks differ from the roster; change Settings or this file so they agree"
            rc=1
          fi
          if grep -nE '^    name:' "$workflow"; then
            echo "::error file=$workflow::a job-level name: replaces the job id as the check's context name, and this audit matches on ids"
            rc=1
          fi
          while read -r name; do
            [ -n "$name" ] || continue
            grep -qxF "$name" <<< "$jobs" \
              || { echo "::error file=$roster::$name is required but is not a job in $workflow"; rc=1; }
          done <<< "$want"
          unrequired=$(comm -23 <(printf '%s\n' "$jobs") <(printf '%s\n' "$want") | paste -sd ' ' -)
          [ -z "$unrequired" ] || echo "::notice::jobs in $workflow that main does not require: $unrequired"
          exit "$rc"

      - uses: ./.github/actions/load-pins

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install clang tools (apt.llvm.org, pinned major)
        uses: ./.github/actions/install-llvm
        with:
          major: ${{ env.LLVM_MAJOR }}
          sha256: ${{ env.LLVM_SH_SHA256 }}
          clang-tidy: "true"
          clang-format: "true"
          llvm: "true" # llvm-nm, which lint-runtime-symbols reads with

      - name: Cache OpenSSL install
        id: openssl-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/openssl-inst
          key: openssl-${{ runner.os }}-${{ env.OPENSSL_VERSION }}-inst

      - name: Build and install OpenSSL at the development version
        if: steps.openssl-cache.outputs.cache-hit != 'true'
        # no-shared so the app carries its own libcrypto: no
        # LD_LIBRARY_PATH, and no chance of binding the system 3.0.
        # no-docs skips the pod2man pass, which is most of the build.
        run: |
          curl -fsSL "https://github.com/openssl/openssl/releases/download/openssl-$OPENSSL_VERSION/openssl-$OPENSSL_VERSION.tar.gz" | tar xz
          cd "openssl-$OPENSSL_VERSION"
          ./Configure --prefix="$OPENSSL_PREFIX" --openssldir="$OPENSSL_PREFIX/ssl" \
            no-shared no-docs
          make -j"$(nproc)"
          # install_ssldirs too: install_sw alone leaves OPENSSLDIR
          # without openssl.cnf, and `openssl req` needs it.
          make install_sw install_ssldirs

      - name: Put the pinned OpenSSL first on PATH
        run: |
          echo "$OPENSSL_PREFIX/bin" >> "$GITHUB_PATH"

      - name: Prove the pinned OpenSSL can issue what e2e needs
        # Not just a version check: mint a certificate the way e2e does
        # and read the date back. A toolchain that cannot issue is how
        # this broke before, and the failure was silent.
        run: |
          command -v openssl
          openssl version
          tmp=$(mktemp -d)
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 \
            -out "$tmp/k.pem"
          openssl req -new -key "$tmp/k.pem" -subj /CN=probe -out "$tmp/r.csr"
          openssl x509 -req -in "$tmp/r.csr" -signkey "$tmp/k.pem" \
            -not_before 000103000000Z -not_after 491231235959Z \
            -sha256 -out "$tmp/c.pem"
          openssl x509 -in "$tmp/c.pem" -noout -startdate |
            grep -q "Jan  3 00:00:00 2000" ||
            { echo "the pinned OpenSSL did not honour -not_before"; exit 1; }
          echo "issued a certificate at an absolute notBefore"

      - name: Cache cppcheck install
        id: cppcheck-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/cppcheck-inst
          key: cppcheck-${{ runner.os }}-${{ env.CPPCHECK_VERSION }}-inst

      - name: Build and install cppcheck at the development version
        if: steps.cppcheck-cache.outputs.cache-hit != 'true'
        # Install into a cached prefix with FILESDIR baked to that prefix,
        # so cppcheck finds std.cfg and the other cfg files at runtime.
        run: |
          curl -fsSL "https://github.com/danmar/cppcheck/archive/refs/tags/$CPPCHECK_VERSION.tar.gz" | tar xz
          cmake -S "cppcheck-$CPPCHECK_VERSION" -B cppcheck-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$HOME/cppcheck-inst" \
            -DFILESDIR="$HOME/cppcheck-inst/share/Cppcheck" >/dev/null
          cmake --build cppcheck-build -j"$(nproc)" >/dev/null
          cmake --install cppcheck-build >/dev/null

      - name: Cache shellcheck
        id: shellcheck-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/shellcheck-inst
          key: shellcheck-${{ runner.os }}-${{ env.SHELLCHECK_VERSION }}-inst

      - name: Install shellcheck at the pinned version
        if: steps.shellcheck-cache.outputs.cache-hit != 'true'
        # The project ships a static binary, so there is nothing to build.
        run: |
          mkdir -p "$HOME/shellcheck-inst"
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v$SHELLCHECK_VERSION/shellcheck-v$SHELLCHECK_VERSION.linux.x86_64.tar.xz" \
            | tar xJ -C "$HOME/shellcheck-inst" --strip-components=1 \
                "shellcheck-v$SHELLCHECK_VERSION/shellcheck"

      - name: Lint the workflows
        # make lint-shellcheck covers the scripts in bench/, proof/ and test/,
        # and the install scripts under .github/actions/. Nothing covered the
        # shell inside these workflow files until this, and actionlint found
        # a real defect there: backticks in a double-quoted echo, which the
        # shell runs as a command. It also checks each `with:` block against
        # the inputs the local action under .github/actions/ declares. It
        # lives here rather than in make check because that target must not
        # need a Go binary to build a C library.
        #
        # The tarball is checked against the published checksum before it runs.
        run: |
          set -euo pipefail
          url="https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION"
          curl -fsSLO "$url/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | sha256sum -c -
          tar xzf "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" actionlint
          ./actionlint .github/workflows/*.yml
          echo "actionlint: every workflow clean"

      - name: Check tool versions match the pins
        # Assert, do not print. The clang tools are installed by
        # versioned name, so an edit that set CLANG_TIDY to the
        # unversioned binary would silently lint with whatever the
        # runner ships while this step still passed.
        run: |
          "$CLANG_TIDY" --version | grep -qE "version $LLVM_MAJOR\\." \
            || { echo "clang-tidy is not the pinned LLVM $LLVM_MAJOR"; exit 1; }
          "$CLANG_FORMAT" --version | grep -qE "version $LLVM_MAJOR\\." \
            || { echo "clang-format is not the pinned LLVM $LLVM_MAJOR"; exit 1; }
          "$CPPCHECK" --version | grep -qF "$CPPCHECK_VERSION" \
            || { echo "cppcheck is not the pinned $CPPCHECK_VERSION"; exit 1; }
          "$CLANG_RV" --version | grep -qE "version $LLVM_MAJOR\\." \
            || { echo "CLANG_RV is not the pinned LLVM $LLVM_MAJOR"; exit 1; }
          go version | grep -qF "go$GO_VERSION " \
            || { echo "go is not the pinned $GO_VERSION"; exit 1; }
          "$SHELLCHECK" --version | grep -qF "version: $SHELLCHECK_VERSION" \
            || { echo "shellcheck is not the pinned $SHELLCHECK_VERSION"; exit 1; }
          # lint-runtime-symbols reads the rv32ic objects with this. Assert it
          # here so a missing package names itself instead of surfacing as an
          # empty symbol list inside make.
          command -v "llvm-nm-$LLVM_MAJOR" >/dev/null || command -v llvm-nm >/dev/null \
            || { echo "llvm-nm is missing; install llvm-$LLVM_MAJOR"; exit 1; }

      - name: Install semgrep (hash-pinned)
        # The only pip package in the security path, so it installs
        # from the hash-pinned requirements file. lint-invariants runs
        # it with local rules and --metrics=off only.
        run: pip install --require-hashes -r .semgrep/requirements.txt

      - name: Install CBMC
        uses: ./.github/actions/install-cbmc
        with:
          version: ${{ env.CBMC_VERSION }}

      - name: Build and install kissat at the development version
        uses: ./.github/actions/install-kissat
        with:
          version: ${{ env.KISSAT_VERSION }}

      - name: Cache Lean toolchain and spec build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.elan
            spec/.lake
          key: lean-${{ runner.os }}-${{ hashFiles('spec/lean-toolchain', 'spec/lakefile.toml', 'spec/lake-manifest.json', 'spec/**/*.lean') }}
          restore-keys: lean-${{ runner.os }}-

      - name: Cache npm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('tools/package-lock.json', 'tools/package.json') }}

      - name: Install elan
        uses: ./.github/actions/install-elan
        with:
          sha256: ${{ env.ELAN_INIT_SHA256 }}

      - run: npm ci
        working-directory: tools

      - name: Lint pushed commits
        # make check re-lints from the root; this pins any failure to the
        # commits under review when a base exists. The range logic lives in
        # the Makefile so this step cannot drift from it: an inline copy is
        # what broke when commitlint moved under tools/.
        run: make lint-commits-range

      - run: make hooks

      - name: Install the Arm GNU toolchain (pinned)
        # check-slow's test-invariants-fast runs the gcc codegen gate
        # (test/lint-wide-multiply-gcc.sh), which needs the Arm GNU gcc
        # the m3 lane pins.
        uses: ./.github/actions/install-arm-gnu
        with:
          version: ${{ env.ARM_GNU_VERSION }}
          sha256: ${{ env.ARM_GNU_LINUX_SHA256 }}
      - name: Put the Arm GNU gcc on PATH
        # test/violations.py runs test/lint-wide-multiply-gcc.sh with no
        # arguments, and the Makefile resolves that gate's gcc through
        # M3_CC's PATH lookup, so the toolchain goes on PATH rather than
        # being passed as a make variable. The inv16-widemul-mid-widened
        # violation is the one only that gate catches
        # (https://github.com/c4milo/chapulin/issues/106).
        run: echo "$HOME/armtc/bin" >> "$GITHUB_PATH"

      # proof/run.sh skips any harness whose content key already recorded
      # a success; restoring the marker directory makes CI incremental
      # the same way development machines are.
      - name: Restore proof cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: proof/.cache
          key: proofs-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: proofs-${{ runner.os }}-

      # One target. Which tier it means is decided in the Makefile, so the
      # workflow holds no copy of that rule.
      - run: make ci
      - name: Render what CBMC proves on the run page
        if: always()
        run: cat bin/proof-coverage.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      # The slow-tier proofs run in the nightly workflow; this job
      # gates pushes and PRs in minutes with the fast tier.

      # Save even on failure or timeout (always() runs on cancelled jobs):
      # every verified harness has already recorded its key, so the next
      # run re-proves only what this one did not finish. A timed-out cold
      # run therefore converges over a couple of pushes instead of
      # starting from zero each time.
      - name: Save proof cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: proof/.cache
          key: proofs-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      # A failed proof's one-line verdict is not diagnosable from the run
      # output alone; keep the full solver logs.
      - name: Upload proof logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proof-results
          path: proof/results/
          if-no-files-found: ignore
