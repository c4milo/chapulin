# Installs elan, the Lean toolchain manager, with --default-toolchain
# none: lake installs the spec/lean-toolchain pin itself, so elan-init
# need not pull an unused stable release. The install is skipped when
# ~/.elan/bin/elan already exists, which a restored Lean cache provides;
# ~/.elan/bin goes on PATH either way. The pin value comes from the job's
# env via ./.github/actions/load-pins: sha256 is ELAN_INIT_SHA256, the
# hash of elan-init.sh, and the download is checked against it before it
# runs (https://github.com/c4milo/chapulin/issues/87).
name: install-elan
description: Install elan with no default toolchain
inputs:
  sha256:
    description: The sha256 of https://elan.lean-lang.org/elan-init.sh (ELAN_INIT_SHA256)
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        SHA256: ${{ inputs.sha256 }}
      run: bash "$GITHUB_ACTION_PATH/install.sh"
