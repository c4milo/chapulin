# actionlint's configuration, which it reads from this path on its own.
# actionlint knows the labels of the runner images GitHub offered when its
# release was cut, and three labels the workflows use are newer than the
# pinned release, 1.7.12: xcode-27, the preview image the macos job in
# check.yml runs on because it is the one hosted image that carries the
# Xcode tools/toolchain.env pins (XCODE_VERSION), and ubuntu-26.04 and
# ubuntu-26.04-arm, which most jobs run on. self-hosted-runner is the one
# key actionlint offers for a label it does not know, although GitHub
# hosts these runners. Drop each entry once actionlint's own list carries
# the label.
self-hosted-runner:
  labels:
    - xcode-27
    - ubuntu-26.04
    - ubuntu-26.04-arm
