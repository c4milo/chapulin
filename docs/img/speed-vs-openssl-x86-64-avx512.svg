<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1126" width="960" height="1126" role="img" aria-labelledby="t d">
<title id="t">chapulin beside OpenSSL 3.6.5 on the Intel(R) Xeon(R) 6975P-C</title>
<desc id="d">On the Intel(R) Xeon(R) 6975P-C, chapulin is faster than OpenSSL 3.6.5 in 26 of 27 rows under gcc and 26 of 27 under clang. Each bar is chapulin's speed in multiples of OpenSSL 3.6.5's: OpenSSL 3.6.5's time over chapulin's, on the same machine in the same run. Under gcc 13.3.0: SHA-256, 16 KiB 1.01x; SHA-256, 64 bytes 1.39x; SHA-384, 16 KiB 0.93x; SHA-384, 64 bytes 1.25x; SHA3-256, 16 KiB 1.03x; SHA3-256, 64 bytes 1.50x; X25519 key generation 2.40x; X25519 shared secret 1.01x; P-256 key generation 1.00x; P-256 shared secret 1.22x; ECDSA P-256 sign 1.19x; ECDSA P-256 verify 1.43x; ECDSA P-384 verify 1.19x; RSA-2048 PKCS#1 v1.5 verify 2.14x; RSA-3072 PKCS#1 v1.5 verify 2.51x; ML-KEM-768 key generation 2.33x; ML-KEM-768 encapsulation 1.10x; ML-KEM-768 decapsulation 1.50x; ML-DSA-87 key generation 1.52x; ML-DSA-87 sign 1.42x; ML-DSA-87 verify 2.52x; AES-128-GCM, the key set and one 16 KiB record sealed 1.01x; AES-128-GCM, the key set and one 16 KiB record opened 1.03x; AES-256-GCM, the key set and one 16 KiB record sealed 1.00x; AES-256-GCM, the key set and one 16 KiB record opened 1.08x; ChaCha20-Poly1305, 16 KiB encrypted and hashed, no tag 1.14x; ChaCha20-Poly1305, 16 KiB hashed and decrypted, no tag 1.15x. Under clang 23.1.6: SHA-256, 16 KiB 1.01x; SHA-256, 64 bytes 1.36x; SHA-384, 16 KiB 0.96x; SHA-384, 64 bytes 1.37x; SHA3-256, 16 KiB 1.05x; SHA3-256, 64 bytes 1.52x; X25519 key generation 2.54x; X25519 shared secret 1.07x; P-256 key generation 1.01x; P-256 shared secret 1.27x; ECDSA P-256 sign 1.20x; ECDSA P-256 verify 1.48x; ECDSA P-384 verify 1.82x; RSA-2048 PKCS#1 v1.5 verify 2.19x; RSA-3072 PKCS#1 v1.5 verify 2.44x; ML-KEM-768 key generation 2.51x; ML-KEM-768 encapsulation 1.21x; ML-KEM-768 decapsulation 1.71x; ML-DSA-87 key generation 1.30x; ML-DSA-87 sign 1.49x; ML-DSA-87 verify 2.71x; AES-128-GCM, the key set and one 16 KiB record sealed 1.05x; AES-128-GCM, the key set and one 16 KiB record opened 1.08x; AES-256-GCM, the key set and one 16 KiB record sealed 1.01x; AES-256-GCM, the key set and one 16 KiB record opened 1.05x; ChaCha20-Poly1305, 16 KiB encrypted and hashed, no tag 1.08x; ChaCha20-Poly1305, 16 KiB hashed and decrypted, no tag 1.09x.</desc>
