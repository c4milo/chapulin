<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1126" width="960" height="1126" role="img" aria-labelledby="t d">
<title id="t">chapulin beside OpenSSL 3.6.5 on the Intel(R) Xeon(R) Platinum 8370C CPU @ 2.80GHz</title>
<desc id="d">On the Intel(R) Xeon(R) Platinum 8370C CPU @ 2.80GHz, chapulin is faster than OpenSSL 3.6.5 in 17 of 27 rows under gcc and 20 of 27 under clang. Each bar is chapulin's speed in multiples of OpenSSL 3.6.5's: OpenSSL 3.6.5's time over chapulin's, on the same machine in the same run. Under gcc 13.3.0: SHA-256, 16 KiB 0.96x; SHA-256, 64 bytes 1.46x; SHA-384, 16 KiB 0.94x; SHA-384, 64 bytes 1.36x; SHA3-256, 16 KiB 1.04x; SHA3-256, 64 bytes 1.39x; X25519 key generation 2.04x; X25519 shared secret 0.98x; P-256 key generation 0.91x; P-256 shared secret 0.97x; ECDSA P-256 sign 1.03x; ECDSA P-256 verify 1.17x; ECDSA P-384 verify 1.46x; RSA-2048 PKCS#1 v1.5 verify 1.92x; RSA-3072 PKCS#1 v1.5 verify 2.33x; ML-KEM-768 key generation 2.44x; ML-KEM-768 encapsulation 1.22x; ML-KEM-768 decapsulation 1.62x; ML-DSA-87 key generation 1.78x; ML-DSA-87 sign 1.64x; ML-DSA-87 verify 3.18x; AES-128-GCM, the key set and one 16 KiB record sealed 0.94x; AES-128-GCM, the key set and one 16 KiB record opened 0.97x; AES-256-GCM, the key set and one 16 KiB record sealed 0.94x; AES-256-GCM, the key set and one 16 KiB record opened 1.01x; ChaCha20-Poly1305, 16 KiB encrypted and hashed, no tag 0.91x; ChaCha20-Poly1305, 16 KiB hashed and decrypted, no tag 0.92x. Under clang 23.1.6: SHA-256, 16 KiB 1.03x; SHA-256, 64 bytes 1.55x; SHA-384, 16 KiB 0.94x; SHA-384, 64 bytes 1.41x; SHA3-256, 16 KiB 1.00x; SHA3-256, 64 bytes 1.43x; X25519 key generation 2.27x; X25519 shared secret 1.06x; P-256 key generation 0.94x; P-256 shared secret 1.03x; ECDSA P-256 sign 1.11x; ECDSA P-256 verify 1.22x; ECDSA P-384 verify 2.13x; RSA-2048 PKCS#1 v1.5 verify 2.12x; RSA-3072 PKCS#1 v1.5 verify 1.95x; ML-KEM-768 key generation 2.61x; ML-KEM-768 encapsulation 1.30x; ML-KEM-768 decapsulation 1.82x; ML-DSA-87 key generation 1.49x; ML-DSA-87 sign 1.64x; ML-DSA-87 verify 3.37x; AES-128-GCM, the key set and one 16 KiB record sealed 0.97x; AES-128-GCM, the key set and one 16 KiB record opened 1.04x; AES-256-GCM, the key set and one 16 KiB record sealed 0.97x; AES-256-GCM, the key set and one 16 KiB record opened 1.04x; ChaCha20-Poly1305, 16 KiB encrypted and hashed, no tag 0.85x; ChaCha20-Poly1305, 16 KiB hashed and decrypted, no tag 0.86x.</desc>
