<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1020" width="960" height="1020" role="img" aria-labelledby="t d">
<title id="t">chapulin's speed beside OpenSSL over time on the Apple M1 Pro</title>
<desc id="d">Each panel is one row of docs/performance-openssl.md's table beside OpenSSL. A line is chapulin's speed in multiples of OpenSSL's at each recording. M1 Pro: runs on 10 days, from 2026-10-08 to 2026-11-20.</desc>
