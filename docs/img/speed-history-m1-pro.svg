<title id="t">chapulin's speed beside OpenSSL over time on the Apple M1 Pro</title>
<desc id="d">Each panel is one row of docs/performance.md's table beside OpenSSL. A line is chapulin's speed in multiples of OpenSSL's at each recording. M1 Pro: runs on 9 days, from 2026-10-08 to 2026-11-17.</desc>
