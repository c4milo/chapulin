<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 678" width="960" height="678" role="img" aria-labelledby="t d">
<title id="t">Reads and writes in place on the Intel Xeon Processor @ 2.10GHz</title>
<desc id="d">On the Intel Xeon Processor @ 2.10GHz under gcc 14.2.0, Reads and writes in place are faster than the copying calls in 27 of 27 rows. Each bar is the in-place call's speed in multiples of the copying call's. Reads, per record: 100 bytes AES-128-GCM 1.07x (1.01 to 1.11), AES-256-GCM 1.08x (1.03 to 1.10), ChaCha20-Poly1305 1.01x (0.99 to 1.05); 1 KiB AES-128-GCM 1.11x (1.05 to 1.13), AES-256-GCM 1.10x (1.04 to 1.12), ChaCha20-Poly1305 1.03x (0.99 to 1.09); 4 KiB AES-128-GCM 1.27x (1.19 to 1.28), AES-256-GCM 1.25x (1.18 to 1.26), ChaCha20-Poly1305 1.07x (1.03 to 1.10); 16 KiB AES-128-GCM 1.35x (1.30 to 1.42), AES-256-GCM 1.31x (1.26 to 1.37), ChaCha20-Poly1305 1.10x (1.07 to 1.16). Writes, per call: 100 bytes AES-128-GCM 1.12x (1.06 to 1.17), AES-256-GCM 1.03x (0.84 to 1.12), ChaCha20-Poly1305 1.03x (1.00 to 1.07); 1 KiB AES-128-GCM 1.15x (1.13 to 1.19), AES-256-GCM 1.21x (1.08 to 1.44), ChaCha20-Poly1305 1.03x (1.01 to 1.06); 4 KiB AES-128-GCM 1.19x (1.18 to 1.22), AES-256-GCM 1.29x (1.16 to 1.34), ChaCha20-Poly1305 1.06x (1.03 to 1.10); 16 KiB AES-128-GCM 1.30x (1.29 to 1.40), AES-256-GCM 1.29x (1.23 to 1.36), ChaCha20-Poly1305 1.09x (1.05 to 1.13); 64 KiB, 4 records AES-128-GCM 1.22x (1.18 to 1.27), AES-256-GCM 1.19x (1.16 to 1.24), ChaCha20-Poly1305 1.07x (1.03 to 1.11).</desc>
<style>
svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#8a8984; --grid:#e4e3df; --first:#2a78d6; --second:#eb6834; --third:#009e73; --unit:#52514e; }
@media (prefers-color-scheme: dark) {
  svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#8f8e86; --grid:#33332f; --first:#3987e5; --second:#d95926; --third:#1fb386; --unit:#c3c2b7; }
}
