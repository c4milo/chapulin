.title { font-size: 17px; font-weight: 600; }
.sub { font-size: 12.5px; fill: var(--ink2); }
.section { font-size: 13.5px; font-weight: 600; }
.row { font-size: 12.5px; fill: var(--ink2); }
.val { font-size: 10.5px; font-weight: 600; paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
.tick { font-size: 11px; fill: var(--muted); }
.legend { font-size: 12.5px; fill: var(--ink2); }
.whisker { stroke: var(--ink2); stroke-width: 1.2; }
</style>
<rect width="960" height="678" rx="8" fill="var(--surface)"/>
<text class="title" x="24" y="34">Reads and writes in place are faster than the copying calls in 27 of 27 rows</text>
<text class="sub" x="24" y="56">Each bar is the in-place call's speed in multiples of the copying call's: the median over 256 pairs of runs of the copying time over the in-place</text>
<text class="sub" x="24" y="74">time. The whisker spans the 25th to the 75th percentile. A longer bar is faster.</text>
<text class="sub" x="24" y="92">Intel Xeon Processor @ 2.10GHz, gcc 14.2.0, Linux, run on 2026-11-27, tree 412b149.</text>
<text class="sub" x="24" y="110">Copying: ch_read and ch_write over callbacks that copy, TRANSPORT=tcp-blocking.</text>
<text class="sub" x="24" y="128">In place: ch_read_in_place and ch_seal_in_place, TRANSPORT=tcp-nonblocking.</text>
<rect x="24" y="144" width="12" height="12" rx="2" fill="var(--first)"/>
<text class="legend" x="42" y="154">AES-128-GCM</text>
<rect x="143" y="144" width="12" height="12" rx="2" fill="var(--second)"/>
<text class="legend" x="161" y="154">AES-256-GCM</text>
