<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="652" viewBox="0 0 1060 652" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="1. Revoking a compromised certificate">
<rect width="1060" height="652" fill="#ffffff"/>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#1b1f24"/></marker><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#cf222e"/></marker><marker id="ag" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#1a7f37"/></marker></defs>
<text x="34" y="34" font-size="17" font-weight="600" fill="#1b1f24">1. Revoking a compromised certificate</text>
<text x="34" y="55" font-size="12.5" fill="#57606a">A thief has controller-01's private key. Two steps retire it.</text>
<line x1="112" y1="112" x2="112" y2="590" stroke="#8c959f" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="34" y="82" width="156" height="28" rx="6" fill="#ffffff" stroke="#0969da" stroke-width="1.4"/>
<text x="112" y="101" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1b1f24">CA</text>
<line x1="530" y1="112" x2="530" y2="590" stroke="#8c959f" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="452" y="82" width="156" height="28" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="1.4"/>
<text x="530" y="101" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1b1f24">controller-01</text>
<line x1="948" y1="112" x2="948" y2="590" stroke="#8c959f" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="870" y="82" width="156" height="28" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="1.4"/>
<text x="948" y="101" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1b1f24">Device</text>
<rect x="718" y="120" width="308" height="29" rx="5" fill="#ddf4ff" stroke="#54aeff"/>
<text x="729" y="137" font-size="11.5" fill="#1b1f24">stored epoch = 2, like the rest of the fleet.</text>
<rect x="34" y="169" width="321" height="46" rx="5" fill="#fff8c5" stroke="#d4a72c"/>
<text x="45" y="186" font-size="11.5" fill="#1b1f24">Step 1: generate a new key pair for the server.</text>
<text x="45" y="203" font-size="11.5" fill="#1b1f24">Step 2: issue its certificate at epoch 3.</text>
<line x1="116" y1="243" x2="520" y2="243" stroke="#1a7f37" stroke-width="1.6" marker-end="url(#ag)"/>
<rect x="200" y="221" width="242" height="18" fill="#ffffff"/>
<text x="321" y="235" font-size="12" text-anchor="middle" fill="#1a7f37" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">new key + certificate (epoch 3)</text>
<line x1="944" y1="303" x2="540" y2="303" stroke="#1b1f24" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="693" y="281" width="93" height="18" fill="#ffffff"/>
<text x="739" y="295" font-size="12" text-anchor="middle" fill="#1b1f24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ClientHello</text>
<line x1="534" y1="349" x2="938" y2="349" stroke="#1b1f24" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="547" y="327" width="384" height="18" fill="#ffffff"/>
<text x="739" y="341" font-size="12" text-anchor="middle" fill="#1b1f24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Certificate (epoch 3), CertificateVerify, Finished</text>
<rect x="737" y="387" width="289" height="63" rx="5" fill="#ddf4ff" stroke="#54aeff"/>
<text x="748" y="404" font-size="11.5" fill="#1b1f24">3 is above 2 and within the bound, and the</text>
<text x="748" y="421" font-size="11.5" fill="#1b1f24">server proved it holds the new key.</text>
<text x="748" y="438" font-size="11.5" fill="#1b1f24">stored epoch = 3, then epoch_store(3).</text>
<rect x="699" y="488" width="327" height="80" rx="5" fill="#fff8c5" stroke="#d4a72c"/>
<text x="710" y="505" font-size="11.5" fill="#1b1f24">The thief still holds the old key, which matches</text>
<text x="710" y="522" font-size="11.5" fill="#1b1f24">only the epoch-2 certificate. That is now below</text>
<text x="710" y="539" font-size="11.5" fill="#1b1f24">the stored 3, so the device refuses it with</text>
<text x="710" y="556" font-size="11.5" fill="#1b1f24">certificate_revoked.</text>
<rect x="34" y="602" width="992" height="34" rx="6" fill="#1a7f37" fill-opacity="0.10" stroke="#1a7f37"/>
<text x="48" y="624" font-size="12.5" font-weight="600" fill="#1a7f37">The stolen key no longer authenticates anywhere in the fleet.</text>
</svg>
