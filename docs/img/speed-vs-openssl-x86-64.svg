<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1126" width="960" height="1126" role="img" aria-labelledby="t d">
<title id="t">chapulin beside OpenSSL 3.6.5 on the AMD EPYC 7763 64-Core Processor</title>
<desc id="d">On the AMD EPYC 7763 64-Core Processor, chapulin is faster than OpenSSL 3.6.5 in 25 of 27 rows under gcc and 25 of 27 under clang. Each bar is chapulin's speed in multiples of OpenSSL 3.6.5's: OpenSSL 3.6.5's time over chapulin's, on the same machine in the same run. Under gcc 13.3.0: SHA-256, 16 KiB 1.01x; SHA-256, 64 bytes 1.75x; SHA-384, 16 KiB 0.95x; SHA-384, 64 bytes 1.44x; SHA3-256, 16 KiB 0.97x; SHA3-256, 64 bytes 1.31x; X25519 key generation 2.25x; X25519 shared secret 1.00x; P-256 key generation 1.04x; P-256 shared secret 1.02x; ECDSA P-256 sign 1.15x; ECDSA P-256 verify 1.24x; ECDSA P-384 verify 1.62x; RSA-2048 PKCS#1 v1.5 verify 1.08x; RSA-3072 PKCS#1 v1.5 verify 1.19x; ML-KEM-768 key generation 2.54x; ML-KEM-768 encapsulation 1.39x; ML-KEM-768 decapsulation 1.79x; ML-DSA-87 key generation 1.77x; ML-DSA-87 sign 1.80x; ML-DSA-87 verify 3.17x; AES-128-GCM, the key set and one 16 KiB record sealed 1.43x; AES-128-GCM, the key set and one 16 KiB record opened 1.48x; AES-256-GCM, the key set and one 16 KiB record sealed 1.37x; AES-256-GCM, the key set and one 16 KiB record opened 1.42x; ChaCha20-Poly1305, 16 KiB encrypted and hashed, no tag 1.16x; ChaCha20-Poly1305, 16 KiB hashed and decrypted, no tag 1.17x. Under clang 23.1.6: SHA-256, 16 KiB 1.01x; SHA-256, 64 bytes 1.55x; SHA-384, 16 KiB 0.96x; SHA-384, 64 bytes 1.52x; SHA3-256, 16 KiB 0.96x; SHA3-256, 64 bytes 1.33x; X25519 key generation 2.42x; X25519 shared secret 1.05x; P-256 key generation 1.09x; P-256 shared secret 1.09x; ECDSA P-256 sign 1.19x; ECDSA P-256 verify 1.30x; ECDSA P-384 verify 2.03x; RSA-2048 PKCS#1 v1.5 verify 1.13x; RSA-3072 PKCS#1 v1.5 verify 1.22x; ML-KEM-768 key generation 2.64x; ML-KEM-768 encapsulation 1.47x; ML-KEM-768 decapsulation 2.01x; ML-DSA-87 key generation 1.50x; ML-DSA-87 sign 1.90x; ML-DSA-87 verify 3.51x; AES-128-GCM, the key set and one 16 KiB record sealed 1.63x; AES-128-GCM, the key set and one 16 KiB record opened 1.65x; AES-256-GCM, the key set and one 16 KiB record sealed 1.56x; AES-256-GCM, the key set and one 16 KiB record opened 1.57x; ChaCha20-Poly1305, 16 KiB encrypted and hashed, no tag 1.13x; ChaCha20-Poly1305, 16 KiB hashed and decrypted, no tag 1.14x.</desc>
