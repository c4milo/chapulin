<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 802" width="960" height="802" role="img" aria-labelledby="t d">
<title id="t">chapulin beside OpenSSL 3.6.5 on the Apple M1 Pro</title>
<desc id="d">On the Apple M1 Pro, chapulin is faster than OpenSSL 3.6.5 in 26 of 27 rows under Apple clang. Each bar is chapulin's speed in multiples of OpenSSL 3.6.5's: OpenSSL 3.6.5's time over chapulin's, on the same machine in the same run. Under Apple clang 21.0.0: SHA-256, 16 KiB 1.01x; SHA-256, 64 bytes 2.05x; SHA-384, 16 KiB 1.01x; SHA-384, 64 bytes 1.45x; SHA3-256, 16 KiB 0.99x; SHA3-256, 64 bytes 2.04x; X25519 key generation 2.71x; X25519 shared secret 1.01x; P-256 key generation 1.08x; P-256 shared secret 1.21x; ECDSA P-256 sign 1.29x; ECDSA P-256 verify 1.47x; ECDSA P-384 verify 1.77x; RSA-2048 PKCS#1 v1.5 verify 1.05x; RSA-3072 PKCS#1 v1.5 verify 1.08x; ML-KEM-768 key generation 2.32x; ML-KEM-768 encapsulation 1.23x; ML-KEM-768 decapsulation 1.60x; ML-DSA-87 key generation 1.32x; ML-DSA-87 sign 1.73x; ML-DSA-87 verify 2.92x; AES-128-GCM, the key set and one 16 KiB record sealed 1.02x; AES-128-GCM, the key set and one 16 KiB record opened 1.03x; AES-256-GCM, the key set and one 16 KiB record sealed 1.01x; AES-256-GCM, the key set and one 16 KiB record opened 1.04x; ChaCha20-Poly1305, 16 KiB encrypted and hashed, no tag 1.02x; ChaCha20-Poly1305, 16 KiB hashed and decrypted, no tag 1.02x.</desc>
<style>
