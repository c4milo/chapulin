<svg xmlns="http://www.w3.org/2000/svg" width="728" height="613" viewBox="0 0 728 613" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="5. Rolling out a new epoch">
<rect width="728" height="613" fill="#ffffff"/>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#1b1f24"/></marker><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#cf222e"/></marker><marker id="ag" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#1a7f37"/></marker></defs>
<text x="34" y="34" font-size="17" font-weight="600" fill="#1b1f24">5. Rolling out a new epoch</text>
<text x="34" y="55" font-size="12.5" fill="#57606a">Reissuing servers one at a time splits the fleet.</text>
<line x1="114" y1="112" x2="114" y2="551" stroke="#8c959f" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="34" y="82" width="160" height="28" rx="6" fill="#ffffff" stroke="#0969da" stroke-width="1.4"/>
<text x="114" y="101" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1b1f24">Device</text>
<line x1="364" y1="112" x2="364" y2="551" stroke="#8c959f" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="284" y="82" width="160" height="28" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="1.4"/>
<text x="364" y="101" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1b1f24">Server A (reissued)</text>
<line x1="614" y1="112" x2="614" y2="551" stroke="#8c959f" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="534" y="82" width="160" height="28" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="1.4"/>
<text x="614" y="101" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1b1f24">Server B (waiting)</text>
<rect x="41" y="113" width="147" height="26" rx="13" fill="#ddf4ff" stroke="#54aeff"/>
<text x="114" y="131" font-size="12" text-anchor="middle" fill="#1b1f24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">stored epoch = 2</text>
<line x1="118" y1="162" x2="354" y2="162" stroke="#1b1f24" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="193" y="140" width="93" height="18" fill="#ffffff"/>
<text x="239" y="154" font-size="12" text-anchor="middle" fill="#1b1f24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ClientHello</text>
<line x1="360" y1="208" x2="124" y2="208" stroke="#1b1f24" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="155" y="186" width="168" height="18" fill="#ffffff"/>
<text x="239" y="200" font-size="12" text-anchor="middle" fill="#1b1f24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Certificate (epoch 3)</text>
<rect x="34" y="246" width="264" height="46" rx="5" fill="#ddf4ff" stroke="#54aeff"/>
<text x="45" y="263" font-size="11.5" fill="#1b1f24">The handshake completes, so the device</text>
<text x="45" y="280" font-size="11.5" fill="#1b1f24">moves forward to 3.</text>
<line x1="118" y1="336" x2="604" y2="336" stroke="#1b1f24" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="318" y="314" width="93" height="18" fill="#ffffff"/>
<text x="364" y="328" font-size="12" text-anchor="middle" fill="#1b1f24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ClientHello</text>
<line x1="610" y1="382" x2="124" y2="382" stroke="#cf222e" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="280" y="360" width="168" height="18" fill="#ffffff"/>
<text x="364" y="374" font-size="12" text-anchor="middle" fill="#cf222e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Certificate (epoch 2)</text>
<rect x="34" y="420" width="308" height="63" rx="5" fill="#fff8c5" stroke="#d4a72c"/>
<text x="45" y="437" font-size="11.5" fill="#1b1f24">2 is below the stored 3, so this server now</text>
<text x="45" y="454" font-size="11.5" fill="#1b1f24">looks revoked. The device cannot use it until</text>
<text x="45" y="471" font-size="11.5" fill="#1b1f24">the rollout gets there.</text>
<line x1="118" y1="511" x2="604" y2="511" stroke="#cf222e" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="265" y="489" width="198" height="18" fill="#ffffff"/>
<text x="364" y="503" font-size="12" text-anchor="middle" fill="#cf222e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">alert certificate_revoked</text>
<rect x="34" y="563" width="660" height="34" rx="6" fill="#cf222e" fill-opacity="0.10" stroke="#cf222e"/>
<text x="48" y="585" font-size="12.5" font-weight="600" fill="#cf222e">Stage every certificate first and cut over together, or treat the window as an outage.</text>
</svg>
