<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="603" viewBox="0 0 1060 603" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="2. Bootstrapping a new device">
<rect width="1060" height="603" fill="#ffffff"/>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#1b1f24"/></marker><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#cf222e"/></marker><marker id="ag" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#1a7f37"/></marker></defs>
<text x="34" y="34" font-size="17" font-weight="600" fill="#1b1f24">2. Bootstrapping a new device</text>
<text x="34" y="55" font-size="12.5" fill="#57606a">A device joins a fleet that has already revoked a few times.</text>
<line x1="112" y1="112" x2="112" y2="541" stroke="#8c959f" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="34" y="82" width="156" height="28" rx="6" fill="#ffffff" stroke="#0969da" stroke-width="1.4"/>
<text x="112" y="101" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1b1f24">Provisioning</text>
<line x1="530" y1="112" x2="530" y2="541" stroke="#8c959f" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="452" y="82" width="156" height="28" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="1.4"/>
<text x="530" y="101" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1b1f24">Device</text>
<line x1="948" y1="112" x2="948" y2="541" stroke="#8c959f" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="870" y="82" width="156" height="28" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="1.4"/>
<text x="948" y="101" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1b1f24">Server</text>
<rect x="34" y="120" width="321" height="46" rx="5" fill="#fff8c5" stroke="#d4a72c"/>
<text x="45" y="137" font-size="11.5" fill="#1b1f24">Write the CA public key and the fleet's current</text>
<text x="45" y="154" font-size="11.5" fill="#1b1f24">epoch, 3. Both go in before the device ships.</text>
<line x1="116" y1="194" x2="520" y2="194" stroke="#1a7f37" stroke-width="1.6" marker-end="url(#ag)"/>
<rect x="256" y="172" width="131" height="18" fill="#ffffff"/>
<text x="321" y="186" font-size="12" text-anchor="middle" fill="#1a7f37" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">CA key + epoch 3</text>
<line x1="534" y1="254" x2="938" y2="254" stroke="#1b1f24" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="611" y="232" width="257" height="18" fill="#ffffff"/>
<text x="739" y="246" font-size="12" text-anchor="middle" fill="#1b1f24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ClientHello  (first ever connect)</text>
<line x1="944" y1="300" x2="540" y2="300" stroke="#1b1f24" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="547" y="278" width="384" height="18" fill="#ffffff"/>
<text x="739" y="292" font-size="12" text-anchor="middle" fill="#1b1f24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Certificate (epoch 3), CertificateVerify, Finished</text>
<rect x="379" y="338" width="302" height="63" rx="5" fill="#ddf4ff" stroke="#54aeff"/>
<text x="390" y="355" font-size="11.5" fill="#1b1f24">3 equals the stored 3: CH_EPOCH_MATCHED.</text>
<text x="390" y="372" font-size="11.5" fill="#1b1f24">The stored value does not change, so nothing</text>
<text x="390" y="389" font-size="11.5" fill="#1b1f24">is written.</text>
<rect x="370" y="439" width="321" height="80" rx="5" fill="#fff8c5" stroke="#d4a72c"/>
<text x="381" y="456" font-size="11.5" fill="#1b1f24">Provision the current epoch, not an old one.</text>
<text x="381" y="473" font-size="11.5" fill="#1b1f24">A device boxed at epoch 3 while the fleet moves</text>
<text x="381" y="490" font-size="11.5" fill="#1b1f24">on has only CH_EPOCH_BOUND steps of shelf life</text>
<text x="381" y="507" font-size="11.5" fill="#1b1f24">before it can no longer join.</text>
<rect x="34" y="553" width="992" height="34" rx="6" fill="#1a7f37" fill-opacity="0.10" stroke="#1a7f37"/>
<text x="48" y="575" font-size="12.5" font-weight="600" fill="#1a7f37">The device joins with no flash write at all.</text>
</svg>
