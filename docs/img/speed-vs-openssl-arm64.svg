<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1126" width="960" height="1126" role="img" aria-labelledby="t d">
<title id="t">chapulin beside OpenSSL 3.6.5 on the ARM Neoverse-N2</title>
<desc id="d">On the ARM Neoverse-N2, chapulin is faster than OpenSSL 3.6.5 in 13 of 27 rows under gcc and 15 of 27 under clang. Each bar is chapulin's speed in multiples of OpenSSL 3.6.5's: OpenSSL 3.6.5's time over chapulin's, on the same machine in the same run. Under gcc 13.3.0: SHA-256, 16 KiB 0.94x; SHA-256, 64 bytes 1.67x; SHA-384, 16 KiB 0.93x; SHA-384, 64 bytes 1.41x; SHA3-256, 16 KiB 0.70x; SHA3-256, 64 bytes 0.96x; X25519 key generation 1.57x; X25519 shared secret 1.04x; P-256 key generation 0.84x; P-256 shared secret 0.91x; ECDSA P-256 sign 0.97x; ECDSA P-256 verify 1.12x; ECDSA P-384 verify 1.80x; RSA-2048 PKCS#1 v1.5 verify 0.70x; RSA-3072 PKCS#1 v1.5 verify 0.68x; ML-KEM-768 key generation 1.27x; ML-KEM-768 encapsulation 0.66x; ML-KEM-768 decapsulation 0.93x; ML-DSA-87 key generation 0.98x; ML-DSA-87 sign 1.01x; ML-DSA-87 verify 1.55x; AES-128-GCM, the key set and one 16 KiB record sealed 1.03x; AES-128-GCM, the key set and one 16 KiB record opened 1.06x; AES-256-GCM, the key set and one 16 KiB record sealed 1.03x; AES-256-GCM, the key set and one 16 KiB record opened 1.03x; ChaCha20-Poly1305, 16 KiB encrypted and hashed, no tag 0.72x; ChaCha20-Poly1305, 16 KiB hashed and decrypted, no tag 0.72x. Under clang 23.1.6: SHA-256, 16 KiB 0.93x; SHA-256, 64 bytes 1.65x; SHA-384, 16 KiB 0.95x; SHA-384, 64 bytes 1.52x; SHA3-256, 16 KiB 0.54x; SHA3-256, 64 bytes 0.81x; X25519 key generation 1.88x; X25519 shared secret 0.95x; P-256 key generation 0.97x; P-256 shared secret 1.10x; ECDSA P-256 sign 1.14x; ECDSA P-256 verify 1.33x; ECDSA P-384 verify 1.85x; RSA-2048 PKCS#1 v1.5 verify 0.93x; RSA-3072 PKCS#1 v1.5 verify 0.97x; ML-KEM-768 key generation 1.35x; ML-KEM-768 encapsulation 0.70x; ML-KEM-768 decapsulation 1.00x; ML-DSA-87 key generation 0.85x; ML-DSA-87 sign 1.23x; ML-DSA-87 verify 1.88x; AES-128-GCM, the key set and one 16 KiB record sealed 1.02x; AES-128-GCM, the key set and one 16 KiB record opened 1.05x; AES-256-GCM, the key set and one 16 KiB record sealed 1.03x; AES-256-GCM, the key set and one 16 KiB record opened 1.03x; ChaCha20-Poly1305, 16 KiB encrypted and hashed, no tag 0.74x; ChaCha20-Poly1305, 16 KiB hashed and decrypted, no tag 0.74x.</desc>
