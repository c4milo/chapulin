<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1126" width="960" height="1126" role="img" aria-labelledby="t d">
<title id="t">chapulin beside OpenSSL 3.6.5 on the ARM Neoverse-N2</title>
<desc id="d">On the ARM Neoverse-N2, chapulin is faster than OpenSSL 3.6.5 in 19 of 27 rows under gcc and 19 of 27 under clang. Each bar is chapulin's speed in multiples of OpenSSL 3.6.5's: OpenSSL 3.6.5's time over chapulin's, on the same machine in the same run. Under gcc 15.2.0: SHA-256, 16 KiB 0.91x; SHA-256, 64 bytes 1.51x; SHA-384, 16 KiB 0.87x; SHA-384, 64 bytes 1.25x; SHA3-256, 16 KiB 0.92x; SHA3-256, 64 bytes 1.21x; X25519 key generation 1.64x; X25519 shared secret 1.02x; P-256 key generation 0.81x; P-256 shared secret 0.92x; ECDSA P-256 sign 0.92x; ECDSA P-256 verify 1.13x; ECDSA P-384 verify 1.79x; RSA-2048 PKCS#1 v1.5 verify 0.68x; RSA-3072 PKCS#1 v1.5 verify 0.67x; ML-KEM-768 key generation 1.41x; ML-KEM-768 encapsulation 1.38x; ML-KEM-768 decapsulation 1.03x; ML-DSA-87 key generation 1.03x; ML-DSA-87 sign 1.08x; ML-DSA-87 verify 1.63x; AES-128-GCM, the key set and one 16 KiB record sealed 1.00x; AES-128-GCM, the key set and one 16 KiB record opened 1.03x; AES-256-GCM, the key set and one 16 KiB record sealed 1.00x; AES-256-GCM, the key set and one 16 KiB record opened 1.01x; ChaCha20-Poly1305, 16 KiB encrypted and hashed, no tag 1.06x; ChaCha20-Poly1305, 16 KiB hashed and decrypted, no tag 1.06x. Under clang 23.1.6: SHA-256, 16 KiB 0.93x; SHA-256, 64 bytes 1.57x; SHA-384, 16 KiB 0.95x; SHA-384, 64 bytes 1.46x; SHA3-256, 16 KiB 0.97x; SHA3-256, 64 bytes 1.28x; X25519 key generation 1.88x; X25519 shared secret 0.95x; P-256 key generation 0.96x; P-256 shared secret 1.09x; ECDSA P-256 sign 1.13x; ECDSA P-256 verify 1.32x; ECDSA P-384 verify 1.86x; RSA-2048 PKCS#1 v1.5 verify 0.93x; RSA-3072 PKCS#1 v1.5 verify 0.97x; ML-KEM-768 key generation 1.56x; ML-KEM-768 encapsulation 1.52x; ML-KEM-768 decapsulation 1.13x; ML-DSA-87 key generation 0.85x; ML-DSA-87 sign 1.25x; ML-DSA-87 verify 1.74x; AES-128-GCM, the key set and one 16 KiB record sealed 1.00x; AES-128-GCM, the key set and one 16 KiB record opened 1.03x; AES-256-GCM, the key set and one 16 KiB record sealed 1.01x; AES-256-GCM, the key set and one 16 KiB record opened 1.01x; ChaCha20-Poly1305, 16 KiB encrypted and hashed, no tag 1.05x; ChaCha20-Poly1305, 16 KiB hashed and decrypted, no tag 1.05x.</desc>
