<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1126" width="960" height="1126" role="img" aria-labelledby="t d">
<title id="t">chapulin beside OpenSSL 3.6.5 on the ARM Neoverse-N2</title>
<desc id="d">On the ARM Neoverse-N2, chapulin is faster than OpenSSL 3.6.5 in 16 of 27 rows under gcc and 17 of 27 under clang. Each bar is chapulin's speed in multiples of OpenSSL 3.6.5's: OpenSSL 3.6.5's time over chapulin's, on the same machine in the same run. Under gcc 13.3.0: SHA-256, 16 KiB 0.93x; SHA-256, 64 bytes 1.67x; SHA-384, 16 KiB 0.93x; SHA-384, 64 bytes 1.41x; SHA3-256, 16 KiB 0.92x; SHA3-256, 64 bytes 1.23x; X25519 key generation 1.57x; X25519 shared secret 1.04x; P-256 key generation 0.85x; P-256 shared secret 0.91x; ECDSA P-256 sign 0.97x; ECDSA P-256 verify 1.12x; ECDSA P-384 verify 1.81x; RSA-2048 PKCS#1 v1.5 verify 0.70x; RSA-3072 PKCS#1 v1.5 verify 0.68x; ML-KEM-768 key generation 1.41x; ML-KEM-768 encapsulation 1.39x; ML-KEM-768 decapsulation 1.01x; ML-DSA-87 key generation 1.03x; ML-DSA-87 sign 1.05x; ML-DSA-87 verify 1.61x; AES-128-GCM, the key set and one 16 KiB record sealed 1.00x; AES-128-GCM, the key set and one 16 KiB record opened 1.03x; AES-256-GCM, the key set and one 16 KiB record sealed 1.01x; AES-256-GCM, the key set and one 16 KiB record opened 1.00x; ChaCha20-Poly1305, 16 KiB encrypted and hashed, no tag 0.72x; ChaCha20-Poly1305, 16 KiB hashed and decrypted, no tag 0.72x. Under clang 23.1.6: SHA-256, 16 KiB 0.93x; SHA-256, 64 bytes 1.67x; SHA-384, 16 KiB 0.95x; SHA-384, 64 bytes 1.52x; SHA3-256, 16 KiB 0.97x; SHA3-256, 64 bytes 1.31x; X25519 key generation 1.88x; X25519 shared secret 0.95x; P-256 key generation 0.98x; P-256 shared secret 1.10x; ECDSA P-256 sign 1.14x; ECDSA P-256 verify 1.33x; ECDSA P-384 verify 1.86x; RSA-2048 PKCS#1 v1.5 verify 0.93x; RSA-3072 PKCS#1 v1.5 verify 0.97x; ML-KEM-768 key generation 1.57x; ML-KEM-768 encapsulation 1.53x; ML-KEM-768 decapsulation 1.14x; ML-DSA-87 key generation 0.85x; ML-DSA-87 sign 1.26x; ML-DSA-87 verify 1.74x; AES-128-GCM, the key set and one 16 KiB record sealed 1.00x; AES-128-GCM, the key set and one 16 KiB record opened 1.03x; AES-256-GCM, the key set and one 16 KiB record sealed 1.01x; AES-256-GCM, the key set and one 16 KiB record opened 1.01x; ChaCha20-Poly1305, 16 KiB encrypted and hashed, no tag 0.75x; ChaCha20-Poly1305, 16 KiB hashed and decrypted, no tag 0.75x.</desc>
