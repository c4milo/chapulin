<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1020" width="960" height="1020" role="img" aria-labelledby="t d">
<title id="t">chapulin's speed beside OpenSSL over time on the ARM Neoverse-N2</title>
<desc id="d">Each panel is one row of docs/performance.md's table beside OpenSSL. A line is chapulin's speed in multiples of OpenSSL's at each recording. arm64 gcc: runs on 1 days, from 2026-11-18 to 2026-11-18. arm64 clang: runs on 1 days, from 2026-11-18 to 2026-11-18.</desc>
<style>
svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#8a8984; --grid:#e4e3df; --first:#2a78d6; --second:#eb6834; --unit:#52514e; }
@media (prefers-color-scheme: dark) {
  svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#8f8e86; --grid:#33332f; --first:#3987e5; --second:#d95926; --unit:#c3c2b7; }
}
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
.title { font-size: 17px; font-weight: 600; }
.sub { font-size: 12.5px; fill: var(--ink2); }
.panel { font-size: 11.5px; font-weight: 600; }
.val { font-size: 10px; font-weight: 600; }
.legend { font-size: 12.5px; fill: var(--ink2); }
</style>
<rect width="960" height="1020" rx="8" fill="var(--surface)"/>
<text class="title" x="24" y="34">chapulin's speed beside OpenSSL at each recording</text>
<text class="sub" x="24" y="56">ARM Neoverse-N2, from 2026-11-18 to 2026-11-18. A point above the dashed line at 1 is a run where chapulin was faster.</text>
<text class="sub" x="24" y="74">Each panel has its own scale. A line draws the last run of each day, and the number at its right is the last run's speed.</text>
