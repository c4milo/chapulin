# Machine-checkable security invariants. Each rule cites its entry in
# docs/invariants.md; a rule with no entry, or an entry that claims a
# rule that does not exist, fails the docs lint.
#
# Run only through `make lint-invariants`: local rules only and
# --metrics=off, never --config auto or any registry config — those
# fetch rules from and upload context to semgrep.dev.
#
# Library sources are the root *.c/*.h. Everything else is excluded
# once, here, so each rule states only its own extra exclusions.
rules:
  - id: inv-2-no-allocator
    languages: [c]
    severity: ERROR
    message: >-
      INV-2: the library never allocates. All state lives in the
      caller's ch_tls and record buffer.
    paths:
      exclude: [test, proof, fuzz, spec, bench, bin, examples]
    pattern-either:
      - pattern: malloc(...)
      - pattern: calloc(...)
      - pattern: realloc(...)
      - pattern: free(...)
      - pattern: alloca(...)

  - id: inv-2-freestanding
    languages: [c]
    severity: ERROR
    message: >-
      INV-2: no OS assumptions in library sources — stdio.h, stdlib.h,
      and time.h stay out. Hosted facilities live in test/ and demo
      code only.
    paths:
      exclude: [test, proof, fuzz, spec, bench, bin, examples]
    pattern-either:
      - pattern: '#include <stdio.h>'
      - pattern: '#include <stdlib.h>'
      - pattern: '#include <time.h>'

  - id: inv-16-no-variable-time-compare
    languages: [c]
    severity: ERROR
    message: >-
      INV-16: comparisons in library sources go through ct_memeq.
      handshake_parser.c and handshake_parser_ee.c are the allowed
      exceptions: the HRR-magic compare in the first and the ALPN name
      compare in the second read only public bytes, stated at each
      site. If your data is public too, state it and extend the
      allowlist in the same PR; semgrep cannot know a buffer is secret,
      so the burden of proof is on the exception.
    paths:
      exclude: [test, proof, fuzz, spec, bench, bin, examples, handshake_parser.c, handshake_parser_ee.c]
    pattern-either:
      - pattern: memcmp(...)
      - pattern: strcmp(...)

  - id: inv-23-no-division-in-mlkem
    languages: [c]
    severity: ERROR
    message: >-
      INV-23: the ML-KEM sources use no division or modulo operator,
      ever — KyberSlash was a compiler emitting a division instruction
      on secret-derived values. Reduce with the module's Barrett or
      Montgomery multiply-shift helpers, and write loop bounds as
      literals.
    paths:
      include: ['mlkem*']
    pattern-either:
      - pattern: '$A / $B'
      - pattern: '$A % $B'
      - pattern: '$A /= $B'
      - pattern: '$A %= $B'

  - id: inv-10-seq-reset-only-in-record
    languages: [c]
    severity: ERROR
    message: >-
      INV-10: only rec_dir_update (record.c) may reset a sequence
      counter. A reset anywhere else can repeat a nonce under a live
      key.
    paths:
      exclude: [test, proof, fuzz, spec, bench, bin, examples, record.c]
    pattern-either:
      - pattern: $D.seq = 0
      - pattern: $D->seq = 0

  - id: inv-4-randomness-sites
    languages: [c]
    severity: ERROR
    message: >-
      INV-4: randomness is consumed at six audited sites: three in
      handshake.c (the third only in the KEX=pq build), two in srv_flight.c (the server's
      key-share scalar and ServerHello random) and the PSS salt in rsa_sign.c. A new call
      site needs its own seeding audit —
      amend docs/invariants.md in the same PR. drbg.c is excluded
      because it defines the hook, not because it may call it.
    paths:
      exclude: [test, proof, fuzz, spec, bench, bin, examples, handshake.c, drbg.c, rsa_sign.c,
                srv_flight.c]
    pattern: ch_rand_bytes(...)

  - id: inv-1-seal-only-in-record
    languages: [c]
    severity: ERROR
    message: >-
      INV-1: record protection is the only sealing path on the TLS
      transport, and quic_packet.c is the only one on the QUIC
      transport, where RFC 9001 §5.3 protects a packet and there is no
      record layer (docs/quic.md). Direct AEAD use anywhere else
      bypasses sequence-number and length discipline. aead.c is
      excluded as the definition site.
    paths:
      exclude: [test, proof, fuzz, spec, bench, bin, examples, record.c, aead.c,
                quic_packet.c]
    pattern-either:
      - pattern: aead_seal(...)
      - pattern: aead_open(...)

  - id: inv-5-profiled-cert-parser
    languages: [c]
    severity: ERROR
    message: >-
      INV-5: exactly one certificate parser per trust mode. DER and
      X.509 readers live in x509_der.c behind x509.c's profile walker,
      and the der_parse in p256.c and the one in p384.c each read
      exactly one ECDSA-Sig-Value. x509_ca.c reads the same DER for
      provisioning and reaches no verdict. The webpki_*.c files read it
      for the TRUST=webpki chain verifier docs/webpki.md describes,
      which only that object packages. A call anywhere else is a parser
      growing. Tripwire grade: this catches honest drift by name, not a
      reintroduction under another name.
    paths:
      exclude: [test, proof, fuzz, spec, bench, bin, examples, p256.c, p384.c, x509.c,
                x509_der.c, x509_ca.c, webpki.h, webpki_time.c, webpki_name.c,
                webpki_spki.c, webpki_sigalg.c, webpki_ext.c, webpki_cert.c]
    patterns:
      - pattern: $F(...)
      # The prefix has to start a name component: the whole identifier,
      # or the part right after an underscore. A substring match read
      # `quic_header_protect` as a DER reader, because "header" ends in
      # the letters "der".
      - metavariable-regex:
          metavariable: $F
          regex: ^(.*_)?(x509_|asn1_|der_).*
      # The one public entry point is not a second parser; its own
      # call-site rule is inv-20-cert-entry-point.
      - metavariable-pattern:
          metavariable: $F
          patterns:
            - pattern-not: x509_verify_leaf

  - id: inv-26-aes-public-keys-only
    languages: [c]
    severity: ERROR
    message: >-
      INV-26: AES exists for QUIC's public keys and nothing else. RFC
      9001 fixes AES-128-GCM for Initial packets (§5.2), AES-128-ECB
      for their header protection (§5.4.3) and AES-128-GCM under a
      printed key for the Retry tag (§5.8), and every key those three
      use is public. So quic_initial.c and quic_retry.c are the only
      library sources that may name an aes_ or gcm_ entry; quic_aes.c,
      quic_gcm.c, the three AES implementations the Makefile AES
      variable chooses among and quic_ghash_hw.c, the GHASH AES=hw adds,
      are excluded as the definition sites.
      ch_aes_block joins the family because an AES=extern build leaves
      that hook to the image, and a library source calling it would run
      AES on a key of its choosing exactly as a call to aes_ would. A use
      anywhere else is a key from the TLS key schedule arriving at a
      lookup-table cipher, and this tree then has a timing story to
      defend (docs/decisions.md entry 6). Tripwire grade: this catches
      honest drift by name, not a reintroduction under another name.
      This rule reads calls and values alone. Building a key is the
      compiler's to refuse: quic_aes.h declares aes_public_key
      incomplete, quic_aes_key.h holds the body, and the three sources
      above are the only ones that include it, which
      `make lint-quic-surface` checks. docs/invariants.md INV-26 states
      what that closes and what review still owes.
    paths:
      exclude: [test, proof, fuzz, spec, bench, bin, examples, quic_initial.c,
                quic_retry.c, quic_aes.c, quic_gcm.c, quic_aes_soft.c,
                quic_aes_hw.c, quic_aes_extern.c, quic_ghash_hw.c]
    pattern-either:
      # A call. `make lint-quic-surface` fails when a function, a
      # function-like macro or a typedef in quic_aes.h, quic_aes_block.h,
      # quic_gcm.h or quic_ghash_hw.h is named anything but aes_ or
      # gcm_, so this prefix family matches a symbol any of them gains
      # tomorrow rather than assuming it.
      - patterns:
          - pattern: $F(...)
          - metavariable-regex:
              metavariable: $F
              regex: ^(aes|gcm|ch_aes)_
      # The name as a value rather than a call: &aes_encrypt_block, a
      # function pointer initialized or assigned from the name, the
      # name passed as an argument. The branch above misses all three,
      # because the later call through that pointer binds $F to the
      # pointer's own name. A direct call matches this branch as well,
      # so semgrep reports one call twice.
      - patterns:
          - pattern: $F
          - metavariable-regex:
              metavariable: $F
              regex: ^(aes|gcm|ch_aes)_

  - id: inv-6-no-pkcs1
    languages: [c]
    severity: ERROR
    message: >-
      INV-6: PKCS#1 v1.5 lives in rsa_pkcs1.c and its one caller,
      webpki_sigalg.c, as signature verify over a public chain, and
      only the TRUST=webpki object packages those files
      (docs/webpki.md). Every other file, the device modes' cert files
      included, sees RSA as PSS verify only, and v1.5 encryption
      padding exists nowhere: that padding imports
      Bleichenbacher-shaped risk. Tripwire grade: this catches honest
      drift by name, not a reintroduction under another name.
    paths:
      exclude: [test, proof, fuzz, spec, bench, bin, examples, rsa_pkcs1.c, webpki_sigalg.c]
    patterns:
      - pattern: $F(...)
      - metavariable-regex:
          metavariable: $F
          regex: .*pkcs1.*

  - id: inv-20-cert-entry-point
    languages: [c]
    severity: ERROR
    message: >-
      INV-20: x509_verify_leaf has one audited call site, in
      handshake_auth.c, where every failure feeds the alert and wipe
      discipline. A new call site needs its own audit — amend
      docs/invariants.md in the same PR. x509.c is excluded because
      it defines the entry, not because it may call it.
    paths:
      exclude: [test, proof, fuzz, spec, bench, bin, examples, handshake_auth.c, x509.c]
    pattern: x509_verify_leaf(...)

  - id: inv-20-provisioning-entry
    languages: [c]
    severity: ERROR
    message: >-
      INV-20: ch_pubkey_from_pem is provisioning, called by firmware
      and by no library source. A call from inside the library would
      put the certificate reader on a path peer input can reach, which
      is the fact INV-5's containment rests on. x509_ca.c is excluded
      because it defines the entry, not because it may call it.
    paths:
      exclude: [test, proof, fuzz, spec, bench, bin, examples, x509_ca.c]
    pattern: ch_pubkey_from_pem(...)

  - id: inv-20-no-time-calls
    languages: [c]
    severity: ERROR
    message: >-
      INV-20: the library never reads a clock. Certificate validity
      is CA reissuance policy, not a device-side time check; the
      target has no clock worth trusting. Complements
      inv-2-freestanding's time.h include ban at the call level.
      test/timing_test.c calls clock_gettime legitimately and sits in the
      standard excludes.
    paths:
      exclude: [test, proof, fuzz, spec, bench, bin, examples]
    pattern-either:
      - pattern: time(...)
      - pattern: clock_gettime(...)
      - pattern: gettimeofday(...)
      - pattern: localtime(...)
      - pattern: gmtime(...)

  - id: inv-18-no-global-mutable-state
    languages: [regex]
    severity: ERROR
    message: >-
      INV-18: no library-global mutable state — all state lives in
      the caller's ch_tls, so sessions cannot interfere. drbg.c is
      the sole documented exception and ships outside the packaged
      library object. const tables are fine.
    paths:
      include: ['*.c', '*.h']
      exclude: [test, proof, fuzz, spec, bench, bin, examples, drbg.c]
    # A regex rule on purpose: the C grammar parses const-qualified
    # custom typedefs inconsistently, so AST patterns either miss
    # them or flag const tables. clang-format puts file-scope
    # declarations at column 0, so a column-anchored `static` is a
    # top-level declaration; the lookahead drops const, and the
    # paren class drops prototypes and definitions. Function-scope
    # statics are not caught — tripwire grade, stated in the doc.
    pattern-regex: '(?m)^static\s+(?!const\b)[^();]*?(=[^;]*)?;'
