# Machine-checkable security invariants. Each rule cites its entry in
# docs/invariants.md; a rule with no entry, or an entry that claims a
# rule that does not exist, fails the docs lint.
#
# Run only through `make lint-invariants`: local rules only and
# --metrics=off, never --config auto or any registry config — those
# fetch rules from and upload context to semgrep.dev.
#
# Library sources are the root *.c/*.h. Everything else is excluded
# once, here, so each rule states only its own extra exclusions.
rules:
  - id: inv-2-no-allocator
    languages: [c]
    severity: ERROR
    message: >-
      INV-2: the library never allocates. All state lives in the
      caller's ch_tls and record buffer.
    paths:
      exclude: [test, proof, fuzz, spec, bench, bin, examples]
    pattern-either:
      - pattern: malloc(...)
      - pattern: calloc(...)
      - pattern: realloc(...)
      - pattern: free(...)
      - pattern: alloca(...)

  - id: inv-2-freestanding
    languages: [c]
    severity: ERROR
    message: >-
      INV-2: no OS assumptions in library sources — stdio.h, stdlib.h,
      and time.h stay out. Hosted facilities live in test/ and demo
      code only.
    paths:
      exclude: [test, proof, fuzz, spec, bench, bin, examples]
    pattern-either:
      - pattern: '#include <stdio.h>'
      - pattern: '#include <stdlib.h>'
      - pattern: '#include <time.h>'

  - id: inv-16-no-variable-time-compare
    languages: [c]
    severity: ERROR
    message: >-
      INV-16: comparisons in library sources go through ct_memeq.
      hsparse.c is the one allowed exception: its HRR-magic compare
      reads only public bytes, stated at the site. If your data is
      public too, state it and extend the allowlist in the same PR;
      semgrep cannot know a buffer is secret, so the burden of proof
      is on the exception.
    paths:
      exclude: [test, proof, fuzz, spec, bench, bin, examples, hsparse.c]
    pattern-either:
      - pattern: memcmp(...)
      - pattern: strcmp(...)

  - id: inv-23-no-division-in-mlkem
    languages: [c]
    severity: ERROR
    message: >-
      INV-23: the ML-KEM sources use no division or modulo operator,
      ever — KyberSlash was a compiler emitting a division instruction
      on secret-derived values. Reduce with the module's Barrett or
      Montgomery multiply-shift helpers, and write loop bounds as
      literals.
    paths:
      include: ['mlkem*']
    pattern-either:
      - pattern: '$A / $B'
      - pattern: '$A % $B'
      - pattern: '$A /= $B'
      - pattern: '$A %= $B'

  - id: inv-10-seq-reset-only-in-record
    languages: [c]
    severity: ERROR
    message: >-
      INV-10: only rec_dir_update (record.c) may reset a sequence
      counter. A reset anywhere else can repeat a nonce under a live
      key.
    paths:
      exclude: [test, proof, fuzz, spec, bench, bin, examples, record.c]
    pattern-either:
      - pattern: $D.seq = 0
      - pattern: $D->seq = 0

  - id: inv-4-randomness-sites
    languages: [c]
    severity: ERROR
    message: >-
      INV-4: randomness is consumed at three audited sites in
      handshake.c (the third only in the KEX=pq build). A new call site needs its own seeding audit —
      amend docs/invariants.md in the same PR. drbg.c is excluded
      because it defines the hook, not because it may call it.
    paths:
      exclude: [test, proof, fuzz, spec, bench, bin, examples, handshake.c, drbg.c]
    pattern: ch_rand_bytes(...)

  - id: inv-1-seal-only-in-record
    languages: [c]
    severity: ERROR
    message: >-
      INV-1: record protection is the only sealing path. Direct AEAD
      use bypasses sequence-number and length discipline. aead.c is
      excluded as the definition site.
    paths:
      exclude: [test, proof, fuzz, spec, bench, bin, examples, record.c, aead.c]
    pattern-either:
      - pattern: aead_seal(...)
      - pattern: aead_open(...)

  - id: inv-5-profiled-cert-parser
    languages: [c]
    severity: ERROR
    message: >-
      INV-5: exactly one certificate parser. DER and X.509 readers
      live in x509_der.c behind x509.c's profile walker, and p256.c's
      der_parse reads exactly one ECDSA-Sig-Value. A call anywhere
      else is a second parser growing. Tripwire grade: this catches
      honest drift by name, not a reintroduction under another name.
    paths:
      exclude: [test, proof, fuzz, spec, bench, bin, examples, p256.c, x509.c, x509_der.c]
    patterns:
      - pattern: $F(...)
      - metavariable-regex:
          metavariable: $F
          regex: .*(x509_|asn1_|der_).*
      # The one public entry point is not a second parser; its own
      # call-site rule is inv-20-cert-entry-point.
      - metavariable-pattern:
          metavariable: $F
          patterns:
            - pattern-not: x509_verify_leaf

  - id: inv-6-no-pkcs1
    languages: [c]
    severity: ERROR
    message: >-
      INV-6: no PKCS#1 v1.5, anywhere — the cert files included. RSA
      exists only as PSS verify; v1.5 padding imports
      Bleichenbacher-shaped risk. Tripwire grade: this catches honest
      drift by name, not a reintroduction under another name.
    paths:
      exclude: [test, proof, fuzz, spec, bench, bin, examples]
    patterns:
      - pattern: $F(...)
      - metavariable-regex:
          metavariable: $F
          regex: .*pkcs1.*

  - id: inv-20-cert-entry-point
    languages: [c]
    severity: ERROR
    message: >-
      INV-20: x509_verify_leaf has one audited call site, in
      handshake.c, where every failure feeds the alert and wipe
      discipline. A new call site needs its own audit — amend
      docs/invariants.md in the same PR. x509.c is excluded because
      it defines the entry, not because it may call it.
    paths:
      exclude: [test, proof, fuzz, spec, bench, bin, examples, handshake.c, x509.c]
    pattern: x509_verify_leaf(...)

  - id: inv-20-no-time-calls
    languages: [c]
    severity: ERROR
    message: >-
      INV-20: the library never reads a clock. Certificate validity
      is CA reissuance policy, not a device-side time check; the
      target has no clock worth trusting. Complements
      inv-2-freestanding's time.h include ban at the call level.
      test/timing_test.c calls clock_gettime legitimately and sits in the
      standard excludes.
    paths:
      exclude: [test, proof, fuzz, spec, bench, bin, examples]
    pattern-either:
      - pattern: time(...)
      - pattern: clock_gettime(...)
      - pattern: gettimeofday(...)
      - pattern: localtime(...)
      - pattern: gmtime(...)

  - id: inv-18-no-global-mutable-state
    languages: [regex]
    severity: ERROR
    message: >-
      INV-18: no library-global mutable state — all state lives in
      the caller's ch_tls, so sessions cannot interfere. drbg.c is
      the sole documented exception and ships outside the packaged
      library object. const tables are fine.
    paths:
      include: ['*.c', '*.h']
      exclude: [test, proof, fuzz, spec, bench, bin, examples, drbg.c]
    # A regex rule on purpose: the C grammar parses const-qualified
    # custom typedefs inconsistently, so AST patterns either miss
    # them or flag const tables. clang-format puts file-scope
    # declarations at column 0, so a column-anchored `static` is a
    # top-level declaration; the lookahead drops const, and the
    # paren class drops prototypes and definitions. Function-scope
    # statics are not caught — tripwire grade, stated in the doc.
    pattern-regex: '(?m)^static\s+(?!const\b)[^();]*?(=[^;]*)?;'
