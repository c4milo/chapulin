name = "spec"
defaultTargets = ["diffspec"]

[[lean_lib]]
name = "Spec"
# Lean's built-in linters, run on every `lake build`. These four find
# nothing today; they are on so that tactic debris cannot creep back in
# — the style guide in CONTRACT.md asks for that and grep cannot check
# it. missingDocs holds the line on the guide's other unbanned rule:
# every public declaration says what it is.
leanOptions = [
  { name = "linter.missingDocs", value = true },
  { name = "linter.extra.unreachableTactic", value = true },
  { name = "linter.unnecessarySimpa", value = true },
  { name = "linter.unusedRCasesPattern", value = true },
  { name = "linter.tactic.unusedName", value = true },
]

[[lean_exe]]
name = "diffspec"
root = "Main"
