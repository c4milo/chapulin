# A rustls TLS 1.3 client for test/e2e.sh. rustls refuses an extension
# response the client did not ask for (RFC 9846 §4.3), and it sends no
# record_size_limit, so it holds this tree's server to INV-63
# (https://github.com/c4milo/chapulin/issues/206). Cargo.lock pins every
# crate, and e2e builds it with --locked.
[package]
name = "rustlsclient"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }

[profile.release]
debug = false
